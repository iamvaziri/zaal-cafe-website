<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5E716B">
  <meta name="robots" content="noindex,nofollow">
  <title>زال کافه | پنل ادمین</title>
  <link rel="preload" href="/assets/fonts/vazirmatn-variable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:'Vazirmatn';src:url('/assets/fonts/vazirmatn-variable.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:swap}
    :root{--g:#5E716B;--o:#E35335;--w:#fff;--m:#f5f5f2;--x:#404040;--line:rgba(0,0,0,.14);--danger:#b5442e;--dangerBg:#fff3f0;--max:1200px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--m);color:#111;font:15px/1.8 'Vazirmatn','Noto Sans Arabic',Tahoma,Arial,sans-serif}
    button,input,textarea,select{font:inherit;font-family:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
    [hidden]{display:none!important}.wrap{width:min(calc(100% - 2rem),var(--max));margin:auto}
    .btn{min-height:42px;border:1px solid #000;background:#fff;padding:.55rem .9rem;display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:12px;white-space:nowrap}
    .btn.orange{background:var(--o);border-color:var(--o);color:#fff}.btn.dark{background:#111;color:#fff;border-color:#111}.btn.danger{background:var(--dangerBg);border-color:#d9b0a7;color:var(--danger)}
    .btn.ghost{background:transparent}.admin-head{position:sticky;top:0;z-index:50;background:#111;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
    .admin-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:72px;padding:.8rem 0}.brand{font-weight:900}.brand small{display:block;font-size:.72rem;color:rgba(255,255,255,.72)}
    .actions{display:flex;gap:.55rem;flex-wrap:wrap}.actions form{margin:0}.main{padding:2rem 0 5rem}.hero{display:flex;justify-content:space-between;gap:1rem;align-items:flex-end;flex-wrap:wrap}.hero h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;margin:.2rem 0}.hero p{margin:.4rem 0 0;color:#666}
    .notice{margin:1rem 0;background:#faf8f4;border:1px solid var(--line);padding:.85rem 1rem;border-radius:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:1.25rem 0}
    .stat{background:#fff;padding:1rem}.stat b{display:block;font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums}.toolbar{display:grid;gap:1rem;margin:1rem 0 1.5rem}.helper{background:#fff;border:1px solid var(--line);padding:.85rem 1rem;border-radius:16px;font-size:.92rem;color:#555}
    .chips{display:flex;gap:.5rem;flex-wrap:wrap}.chips button{min-height:40px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:.35rem .85rem;font-weight:800}.chips button.active{background:var(--g);color:#fff;border-color:var(--g)}
    .section{margin:1.3rem 0 1.8rem}.section-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:.7rem 0}.section-head h2,.section-head h3{margin:0}.section-head span{font-size:.85rem;color:#666}
    .row{display:grid;grid-template-columns:80px minmax(0,1fr) 140px 220px auto;gap:.65rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:.75rem;margin:.6rem 0}
    .thumb,.thumb-fallback{width:80px;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#e8e8e8}.thumb img{width:100%;height:100%;object-fit:cover}.thumb-fallback{display:grid;place-items:center;font-weight:900;color:#666}
    .row h3{margin:0 0 .25rem;font-size:1rem}.row p{margin:0;color:#666;font-size:.82rem}.field-inline{display:flex;gap:.4rem;align-items:center}.field-inline input{flex:1}
    input,textarea,select{width:100%;min-height:42px;border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem;background:#fff}.row-actions{display:flex;gap:.35rem;flex-wrap:wrap}.row-actions button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#fff}.row-actions button[data-delete-product]{border-color:#d9b0a7;background:var(--dangerBg);color:var(--danger)}
    dialog{border:0;padding:0;border-radius:24px;max-width:none;box-shadow:0 24px 64px rgba(0,0,0,.24)}dialog::backdrop{background:rgba(0,0,0,.45)}
    .sheet{width:min(900px,calc(100% - 1rem));max-height:92svh;overflow:auto;background:#fff}.sheet-head,.sheet-foot{position:sticky;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;background:#fff}.sheet-head{top:0;border-bottom:1px solid var(--line)}.sheet-foot{bottom:0;border-top:1px solid var(--line)}.sheet-body{padding:1.2rem}
    .close{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.2rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.grid .full{grid-column:1/-1}.field{display:grid;gap:.35rem}.field label{font-size:.78rem;font-weight:900}.checks{display:flex;gap:.6rem;flex-wrap:wrap}.checks label{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .65rem;border:1px solid var(--line);border-radius:999px;background:#fff}.category-row{display:grid;grid-template-columns:1fr 1fr auto;gap:1rem;align-items:end;margin-top:1rem}
    .muted{color:#666}.empty{padding:2rem;border:1px dashed var(--line);border-radius:18px;background:#fff;text-align:center;color:#666}.toast-box{position:fixed;left:1rem;bottom:1rem;z-index:80}.toast{background:#111;color:#fff;padding:.85rem 1rem;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    @media (max-width:900px){.row{grid-template-columns:72px minmax(0,1fr) auto}.row select,.row .field-inline,.row .row-actions{grid-column:2/-1}.grid{grid-template-columns:1fr}.category-row{grid-template-columns:1fr}}
    @media (max-width:640px){.admin-head .wrap{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:64px minmax(0,1fr)}.row .row-actions{grid-column:1/-1}.thumb,.thumb-fallback{width:64px}.sheet{width:100%;height:100svh;max-height:100svh;border-radius:0}}
  </style>
</head>
<body>
  <header class="admin-head">
    <div class="wrap">
      <div class="brand">زال / Zaal <small>پنل مدیریت منو</small></div>
      <div class="actions">
        <a class="btn ghost" href="/fa/menu/" target="_blank" rel="noopener noreferrer">پیش‌نمایش منو</a>
        <form method="post" action="/admin/logout"><button class="btn" type="submit">خروج</button></form>
      </div>
    </div>
  </header>
  <main class="wrap main" id="app"></main>
  <div class="toast-box" id="toastBox"></div>
  <dialog class="sheet" id="editor"></dialog>
  <dialog class="sheet" id="categoryEditor"></dialog>
  <dialog class="sheet" id="confirm"></dialog>
  <script>
  const ADMIN_CACHE_KEY='zaal-admin-catalog-cache-v2';
  const EMPTY_CATALOG={version:1,taste:[],palate:[],categories:[],products:[]};
  const app=document.getElementById('app');
  const toastBox=document.getElementById('toastBox');
  let catalog=clone(EMPTY_CATALOG);
  let catalogRevision=1;
  let catalogUpdatedAt=null;
  let catalogSource='empty';
  let ui={adminCategory:'all',editing:null};

  function clone(v){return JSON.parse(JSON.stringify(v))}
  function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
  function digits(v){return new Intl.NumberFormat('fa-IR').format(Number(v)||0)}
  function money(v){return `${digits(v)} تومان`}
  function parseNum(v){return Number(String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g,''))||0}
  function toast(message){toastBox.innerHTML=`<div class="toast">${message}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>toastBox.innerHTML='',3200)}
  function readCache(){try{return JSON.parse(localStorage.getItem(ADMIN_CACHE_KEY)||'null')}catch(_){return null}}
  function writeCache(){try{localStorage.setItem(ADMIN_CACHE_KEY,JSON.stringify({catalog,revision:catalogRevision,updatedAt:catalogUpdatedAt,savedAt:Date.now()}))}catch(_){}}
  function normalizeCatalog(raw){if(!raw||!Array.isArray(raw.categories)||!Array.isArray(raw.products))return clone(EMPTY_CATALOG);return{version:Number(raw.version)||1,taste:Array.isArray(raw.taste)?raw.taste:[],palate:Array.isArray(raw.palate)?raw.palate:[],categories:raw.categories,products:raw.products}}
  async function loadCatalog(){if(location.protocol==='file:'){const cached=readCache();catalog=normalizeCatalog(cached?.catalog||EMPTY_CATALOG);catalogRevision=Number(cached?.revision)||1;catalogUpdatedAt=cached?.updatedAt||null;catalogSource='file';return}try{const response=await fetch('/admin/api/catalog',{headers:{accept:'application/json'},cache:'no-store',credentials:'same-origin'});if(response.status===401||response.status===403){location.reload();return}const data=await response.json().catch(()=>null);if(!response.ok||!data?.ok||!data.catalog)throw new Error(data?.error?.message||`HTTP ${response.status}`);catalog=normalizeCatalog(data.catalog);catalogRevision=Number(data.revision)||1;catalogUpdatedAt=data.updatedAt||null;catalogSource='api';writeCache()}catch(error){console.error('catalog_load_failed',error);const cached=readCache();catalog=normalizeCatalog(cached?.catalog||EMPTY_CATALOG);catalogRevision=Number(cached?.revision)||1;catalogUpdatedAt=cached?.updatedAt||null;catalogSource=cached?'cache':'empty'}}
  async function saveCatalog(successMessage){catalog.version=Number(catalog.version)||1;if(location.protocol==='file:'){writeCache();if(successMessage)toast(successMessage);return true}try{const response=await fetch('/admin/api/catalog',{method:'PUT',credentials:'same-origin',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({catalog,revision:catalogRevision})});const data=await response.json().catch(()=>null);if(response.status===401||response.status===403){toast('نشست مدیریت منقضی شده؛ صفحه دوباره باز می‌شود.');setTimeout(()=>location.reload(),700);return false}if(response.status===409){toast('داده‌ها در نشست دیگری تغییر کرده‌اند؛ صفحه دوباره بارگذاری می‌شود.');setTimeout(()=>location.reload(),900);return false}if(!response.ok||!data?.ok)throw new Error(data?.error?.message||`HTTP ${response.status}`);catalogRevision=Number(data.revision)||catalogRevision+1;catalogUpdatedAt=data.updatedAt||null;catalogSource='api';writeCache();if(successMessage)toast(successMessage);return true}catch(error){console.error('catalog_save_failed',error);toast('ذخیره روی سرور انجام نشد؛ دوباره تلاش کنید.');return false}}
  function productThumb(p){const src=p?.image||p?.imageData||'';if(src)return `<div class="thumb"><img src="${src}" alt="${esc(p?.i?.fa?.n||'')}"></div>`;const initials=esc((p?.i?.fa?.n||p?.id||'?').slice(0,2));return `<div class="thumb-fallback">${initials}</div>`}
  function cat(id){return catalog.categories.find(c=>c.id===id)||null}
  function sortedCategories(){return catalog.categories.slice().sort((a,b)=>(a.order||0)-(b.order||0))}
  function sortedProducts(){return catalog.products.slice().sort((a,b)=>((a.sortOrder||0)-(b.sortOrder||0))||String(a.id).localeCompare(String(b.id)))}
  function adminCategoryBar(){const items=[{id:'all',fa:'همه'},...sortedCategories()];return `<div class="chips">${items.map(item=>`<button type="button" class="${ui.adminCategory===item.id?'active':''}" data-admin-cat="${item.id}">${esc(item.fa)}</button>`).join('')}</div>`}
  function adminProductRow(p){const category=cat(p.categoryId);return `<article class="row">${productThumb(p)}<div><h3>${esc(p.i?.fa?.n||p.id)}</h3><p>${esc(p.i?.en?.n||'بدون نام انگلیسی')} · ${esc(category?.fa||'بدون دسته')}</p></div><select data-status="${p.id}"><option value="available" ${p.status==='available'?'selected':''}>موجود</option><option value="sold_out" ${p.status==='sold_out'?'selected':''}>ناموجود</option><option value="hidden" ${p.status==='hidden'?'selected':''}>پنهان</option></select><div class="field-inline"><input id="price-${p.id}" value="${digits(p.price)}" inputmode="numeric" dir="ltr"><button class="btn" data-save-price="${p.id}">ذخیره</button></div><div class="row-actions"><button title="کپی" data-duplicate="${p.id}">⧉</button><button title="ویرایش" data-edit="${p.id}">✎</button><button title="حذف" data-delete-product="${p.id}">🗑</button></div></article>`}
  function adminRows(){const cats=sortedCategories();const sections=cats.map(category=>{if(ui.adminCategory!=='all'&&ui.adminCategory!==category.id)return '';const rows=sortedProducts().filter(p=>p.categoryId===category.id);if(!rows.length)return '';return `<section class="section"><div class="section-head"><h3>${esc(category.fa)}</h3><span>${digits(rows.length)} محصول</span></div>${rows.map(adminProductRow).join('')}</section>`}).join('');return sections||'<div class="empty">هنوز محصولی ثبت نشده است.</div>'}
  function render(){document.title='زال کافه | پنل ادمین';const available=catalog.products.filter(p=>p.status==='available').length;const soldOut=catalog.products.filter(p=>p.status==='sold_out').length;const hidden=catalog.products.filter(p=>p.status==='hidden').length;app.innerHTML=`<section class="hero"><div><h1>مدیریت منو</h1><p>نسخهٔ سبک و مستقیم برای مدیریت منوی زال کافه.</p></div><div class="actions"><button class="btn" data-action="categories">مدیریت دسته‌ها</button><button class="btn orange" data-action="add-product">افزودن محصول</button></div></section><div class="notice">${catalogSource==='api'?`متصل به پایگاه داده D1 · نسخهٔ ${digits(catalogRevision)}${catalogUpdatedAt?` · آخرین ذخیره: ${esc(new Date(catalogUpdatedAt).toLocaleString('fa-IR'))}`:''}`:catalogSource==='cache'?'نمایش از کش محلی؛ در اولین فرصت اتصال سرور را بررسی کن.':'اتصال زنده در دسترس نیست؛ فعلاً نسخهٔ محلی نمایش داده می‌شود.'}</div><div class="stats"><div class="stat"><b>${digits(catalog.products.length)}</b><span>همه</span></div><div class="stat"><b>${digits(available)}</b><span>موجود</span></div><div class="stat"><b>${digits(soldOut)}</b><span>ناموجود</span></div><div class="stat"><b>${digits(hidden)}</b><span>پنهان</span></div></div><div class="toolbar"><div class="helper">برای حذف از منوی عمومی بهتر است وضعیت «پنهان» را انتخاب کنی. دکمهٔ حذف، محصول را واقعاً از کاتالوگ پاک می‌کند.</div>${adminCategoryBar()}</div><section class="section"><div class="section-head"><h2>محصولات</h2><span>${digits(catalog.categories.length)} دسته</span></div>${adminRows()}</section>`}
  function nextSortOrder(){return catalog.products.reduce((max,p)=>Math.max(max,Number(p.sortOrder)||0),0)+1}
  function blankProduct(){return{id:`new-${Date.now()}`,slug:`new-${Date.now()}`,categoryId:catalog.categories[0]?.id||'',sortOrder:nextSortOrder(),status:'hidden',price:0,priceVariants:[],currency:'TOMAN',i:{fa:{n:'',s:'',d:'',g:''},en:{n:'',s:'',d:'',g:''}},aliases:[],tasteTags:[],palateTags:[],profile:[2,2,2,2],temperature:'hot',caffeine:'medium',allergens:[],dietary:[],art:['#5E716B','#FFFFFF','#E35335'],kind:'cup',featured:false,image:null}}
  function openEditor(id){if(!catalog.categories.length){toast('اول حداقل یک دسته بساز.');return}ui.editing=clone(id?catalog.products.find(p=>p.id===id):blankProduct());const p=ui.editing;const dialog=document.getElementById('editor');dialog.innerHTML=`<div class="sheet-head"><h2>${id?`ویرایش ${esc(p.i.fa.n||p.id)}`:'محصول جدید'}</h2><button class="close" data-close="editor">×</button></div><form class="sheet-body" id="productForm"><div class="grid"><div class="field"><label>نام فارسی</label><input name="fan" value="${esc(p.i.fa.n)}" required></div><div class="field"><label>English name</label><input name="enn" value="${esc(p.i.en.n)}" dir="ltr"></div><div class="field"><label>روایت کوتاه فارسی</label><input name="fas" value="${esc(p.i.fa.s||'')}"></div><div class="field"><label>English short story</label><input name="ens" value="${esc(p.i.en.s||'')}" dir="ltr"></div><div class="field full"><label>توضیح فارسی</label><textarea name="fad" rows="4">${esc(p.i.fa.d||'')}</textarea></div><div class="field full"><label>English description</label><textarea name="end" rows="4" dir="ltr">${esc(p.i.en.d||'')}</textarea></div><div class="field full"><label>مواد / جزئیات فارسی</label><textarea name="fag" rows="3">${esc(p.i.fa.g||'')}</textarea></div><div class="field full"><label>English ingredients / details</label><textarea name="eng" rows="3" dir="ltr">${esc(p.i.en.g||'')}</textarea></div><div class="field"><label>دسته</label><select name="category">${sortedCategories().map(c=>`<option value="${c.id}" ${p.categoryId===c.id?'selected':''}>${esc(c.fa)}</option>`).join('')}</select></div><div class="field"><label>وضعیت</label><select name="status"><option value="available" ${p.status==='available'?'selected':''}>موجود</option><option value="sold_out" ${p.status==='sold_out'?'selected':''}>ناموجود</option><option value="hidden" ${p.status==='hidden'?'selected':''}>پنهان</option></select></div><div class="field"><label>قیمت (تومان)</label><input name="price" value="${Number(p.price)||0}" inputmode="numeric" dir="ltr"></div><div class="field"><label>ترتیب نمایش</label><input name="sortOrder" value="${Number(p.sortOrder)||0}" inputmode="numeric" dir="ltr"></div><div class="field full"><label>تگ‌های مزه</label><div class="checks">${(catalog.taste||[]).map(item=>`<label><input type="checkbox" name="taste" value="${item[0]}" ${p.tasteTags?.includes(item[0])?'checked':''}> ${esc(item[1])}</label>`).join('')||'<span class="muted">تعریف نشده</span>'}</div></div><div class="field full"><label>تگ‌های ذائقه</label><div class="checks">${(catalog.palate||[]).map(item=>`<label><input type="checkbox" name="palate" value="${item[0]}" ${p.palateTags?.includes(item[0])?'checked':''}> ${esc(item[1])}</label>`).join('')||'<span class="muted">تعریف نشده</span>'}</div></div></div></form><div class="sheet-foot"><button class="btn" data-close="editor" type="button">انصراف</button><button class="btn orange" type="submit" form="productForm">ذخیره</button></div>`;dialog.showModal()}
  function openCategoryEditor(){const dialog=document.getElementById('categoryEditor');dialog.innerHTML=`<div class="sheet-head"><h2>دسته‌ها</h2><button class="close" data-close="categoryEditor">×</button></div><div class="sheet-body"><p class="muted">حذف یک دسته، محصولاتش را به اولین دستهٔ باقی‌مانده منتقل می‌کند.</p>${sortedCategories().map(c=>`<div class="category-row"><div class="field"><label>فارسی</label><input data-cat-fa="${c.id}" value="${esc(c.fa)}"></div><div class="field"><label>English</label><input data-cat-en="${c.id}" value="${esc(c.en)}" dir="ltr"></div><button class="btn danger" type="button" data-delete-category="${c.id}">حذف</button></div>`).join('')||'<div class="empty">هنوز دسته‌ای وجود ندارد.</div>'}</div><div class="sheet-foot"><button class="btn" type="button" data-add-category>+ دسته</button><button class="btn orange" type="button" data-save-categories>ذخیره دسته‌ها</button></div>`;dialog.showModal()}
  function openConfirmDelete(id){const product=catalog.products.find(p=>p.id===id);if(!product)return;const dialog=document.getElementById('confirm');dialog.innerHTML=`<div class="sheet-head"><h2>حذف محصول</h2><button class="close" data-close="confirm">×</button></div><div class="sheet-body"><p>«${esc(product.i?.fa?.n||product.id)}» به‌طور کامل از کاتالوگ حذف می‌شود.</p><p class="muted">اگر فقط نمی‌خواهی در منوی عمومی دیده شود، وضعیتش را روی «پنهان» بگذار.</p></div><div class="sheet-foot"><button class="btn" data-close="confirm" type="button">انصراف</button><button class="btn danger" data-confirm-delete="${id}" type="button">حذف محصول</button></div>`;dialog.showModal()}
  async function duplicateProduct(id){const src=catalog.products.find(p=>p.id===id);if(!src)return;const previous=clone(catalog);const copy=clone(src);copy.id=`${src.id}-copy-${Date.now()}`;copy.slug=copy.id;copy.i.fa.n=(copy.i.fa.n||src.id)+' — کپی';copy.i.en.n=(copy.i.en.n||src.id)+' — Copy';copy.status='hidden';copy.sortOrder=nextSortOrder();catalog.products.push(copy);if(await saveCatalog('نسخهٔ کپی ساخته شد.'))render();else catalog=previous}
  async function deleteProduct(id){const previous=clone(catalog);const product=catalog.products.find(p=>p.id===id);catalog.products=catalog.products.filter(p=>p.id!==id);if(await saveCatalog(`محصول «${product?.i?.fa?.n||id}» حذف شد.`)){document.getElementById('confirm').close();render()}else catalog=previous}
  document.addEventListener('click',async event=>{const target=event.target.closest('button,[data-close]');if(!target)return;if(target.dataset.close){document.getElementById(target.dataset.close)?.close();return}if(target.dataset.adminCat){ui.adminCategory=target.dataset.adminCat;render();return}if(target.dataset.action==='categories'){openCategoryEditor();return}if(target.dataset.action==='add-product'){openEditor();return}if(target.dataset.edit){openEditor(target.dataset.edit);return}if(target.dataset.duplicate){await duplicateProduct(target.dataset.duplicate);return}if(target.dataset.deleteProduct){openConfirmDelete(target.dataset.deleteProduct);return}if(target.dataset.confirmDelete){await deleteProduct(target.dataset.confirmDelete);return}if(target.dataset.savePrice){const p=catalog.products.find(item=>item.id===target.dataset.savePrice);if(!p)return;const previous=p.price;const value=parseNum(document.getElementById(`price-${p.id}`).value);if(value<0){toast('قیمت معتبر وارد کن.');return}p.price=value;if(await saveCatalog(`قیمت «${p.i.fa.n||p.id}» ذخیره شد.`)){document.getElementById(`price-${p.id}`).value=digits(value);render()}else p.price=previous;return}if(target.matches('[data-add-category]')){catalog.categories.push({id:`cat-${Date.now()}`,order:catalog.categories.length+1,fa:'دسته جدید',en:'New category',faDesc:'',enDesc:''});document.getElementById('categoryEditor').close();openCategoryEditor();return}if(target.matches('[data-delete-category]')){const id=target.dataset.deleteCategory;if(catalog.categories.length<=1){toast('حداقل یک دسته باید باقی بماند.');return}const remaining=catalog.categories.filter(c=>c.id!==id).map((c,index)=>({...c,order:index+1}));const fallback=remaining[0]?.id||'';catalog.products.forEach(p=>{if(p.categoryId===id)p.categoryId=fallback});catalog.categories=remaining;document.getElementById('categoryEditor').close();openCategoryEditor();return}if(target.matches('[data-save-categories]')){const previous=clone(catalog);document.querySelectorAll('[data-cat-fa]').forEach(input=>{const category=catalog.categories.find(c=>c.id===input.dataset.catFa);if(category)category.fa=input.value.trim()||category.fa});document.querySelectorAll('[data-cat-en]').forEach(input=>{const category=catalog.categories.find(c=>c.id===input.dataset.catEn);if(category)category.en=input.value.trim()||category.en});catalog.categories=catalog.categories.map((c,index)=>({...c,order:index+1}));if(await saveCatalog('دسته‌ها ذخیره شدند.')){document.getElementById('categoryEditor').close();render()}else catalog=previous;return}})
  document.addEventListener('change',async event=>{const select=event.target.closest('[data-status]');if(!select)return;const product=catalog.products.find(p=>p.id===select.dataset.status);if(!product)return;const previous=product.status;product.status=select.value;if(await saveCatalog(`وضعیت «${product.i.fa.n||product.id}» ذخیره شد.`))render();else{product.status=previous;select.value=previous}})
  document.addEventListener('submit',async event=>{if(event.target.id!=='productForm')return;event.preventDefault();const form=event.target;const previous=clone(catalog);const p=ui.editing;for(const [lang,key,name] of [['fa','n','fan'],['fa','s','fas'],['fa','d','fad'],['fa','g','fag'],['en','n','enn'],['en','s','ens'],['en','d','end'],['en','g','eng']]){p.i[lang][key]=form.elements[name].value.trim()}p.categoryId=form.elements.category.value;p.status=form.elements.status.value;p.price=parseNum(form.elements.price.value);p.sortOrder=parseNum(form.elements.sortOrder.value)||nextSortOrder();p.tasteTags=[...form.querySelectorAll('input[name="taste"]:checked')].map(input=>input.value);p.palateTags=[...form.querySelectorAll('input[name="palate"]:checked')].map(input=>input.value);p.aliases=[...new Set([...(p.aliases||[]),p.i.fa.n,p.i.en.n].filter(Boolean))];const index=catalog.products.findIndex(item=>item.id===p.id);if(index>=0)catalog.products[index]=p;else catalog.products.push(p);if(await saveCatalog('محصول ذخیره شد.')){document.getElementById('editor').close();render()}else catalog=previous})
  loadCatalog().then(render)
  </script>
</body>
