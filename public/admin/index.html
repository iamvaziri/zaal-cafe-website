:root{--ink:#000;--muted:#666;--sage-deep:var(--g);--line:var(--ln)}
.header-title,.footer-wordmark{font-family:AntonZaal,Impact,sans-serif;font-weight:400;text-transform:uppercase;white-space:nowrap;text-rendering:geometricPrecision}
.site-header{display:grid;grid-template-columns:minmax(76px,1fr) auto minmax(76px,1fr);gap:10px;height:100%;align-items:center}
.site-header .brand{justify-self:start;width:44px;height:44px;padding:2px;overflow:hidden;display:block}
.site-header .brand img{width:100%;height:100%;object-fit:contain}
.header-title{justify-self:center;text-align:center;font-size:1.05rem;line-height:1;letter-spacing:.16em;color:var(--ink)}
.header-actions{justify-self:end;display:flex;align-items:center;gap:.4rem}
.header-actions .nav{display:flex;align-items:center;gap:.15rem}
.language-btn{min-height:40px;padding:0 .6rem}
@media(min-width:760px){.header-title{font-size:1.2rem}}
@media(max-width:620px){.header-actions .nav a:first-child{display:none}}
.footer{background:var(--x);color:#fff;padding:clamp(2.4rem,6vw,3.6rem) 0 1.6rem}
.footer-main{display:flex;justify-content:space-between;align-items:center;gap:2rem;flex-wrap:wrap}
.footer-lockup{display:flex;align-items:center;gap:1.1rem}
.footer-logo{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:10px;padding:6px}
.footer-copy{display:grid;gap:.5rem}
.footer-wordmark{font-size:clamp(1.9rem,5vw,2.9rem);line-height:.9;letter-spacing:.06em;color:#fff}
.footer-tagline{margin:0;color:rgba(255,255,255,.7);font-size:.85rem;max-width:34ch}
.footer-links{display:flex;gap:.6rem;flex-wrap:wrap}
.footer-icon-link{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);border-radius:50%;display:grid;place-items:center;color:#fff;transition:.2s ease}
.footer-icon-link:hover{background:var(--o);border-color:var(--o)}
.footer-icon-link .svg-icon{width:18px;height:18px}
.footer-icon-link.snappfood-icon span{font-size:.6rem;font-weight:900;letter-spacing:-.04em}
.footer-bottom{border-top:1px solid rgba(255,255,255,.18);margin-top:2rem;padding-top:1.1rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:rgba(255,255,255,.6);font-size:.75rem}
@media(max-width:620px){.footer-main{flex-direction:column;align-items:flex-start}.footer-bottom{flex-direction:column}}


.container{width:min(1180px,calc(100% - 36px));margin-inline:auto}
    .landing-eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--sage);font-size:.76rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    .landing-eyebrow::before{content:"";width:28px;height:2px;background:currentColor}
    .landing-hero{padding:22px 0 50px}
    .hero-grid{display:grid;gap:20px}
    .hero-copy{padding:12px 2px 6px;display:flex;flex-direction:column;justify-content:center}
    h1,h2,h3,p{margin-top:0}
    h1{font-family:var(--font-display);font-size:clamp(2.65rem,13vw,5.6rem);line-height:.99;letter-spacing:-.065em;margin:18px 0 18px;font-weight:850;max-width:11ch}
    .hero-lead{font-size:1.04rem;line-height:1.9;color:#525754;max-width:42ch;margin-bottom:22px}
    .landing-actions{display:flex;flex-wrap:wrap;gap:10px}
    .landing-btn{min-height:48px;border-radius:999px;padding:0 20px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:850;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.15;text-align:center}
    .landing-btn.primary{background:var(--orange);border-color:var(--orange);color:#171a19}
    .landing-btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
    .landing-btn.ghost{background:transparent}
    .hero-media{position:relative;border-radius:0;clip-path:polygon(0 0,100% 0,100% 100%,34px 100%,0 calc(100% - 34px));overflow:hidden;min-height:430px;background:var(--sage)}
    .hero-media>img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
    .hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 44%,rgba(20,25,23,.62))}
    .hero-stamp{position:absolute;z-index:2;inset-block-start:16px;inset-inline-start:16px;width:78px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--orange);color:#fff;font-size:.64rem;font-weight:900;line-height:1.2;transform:rotate(-8deg)}
    .hero-caption{position:absolute;z-index:2;inset-inline:20px;inset-block-end:18px;color:#fff;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
    .hero-caption b{font-size:1.12rem}.hero-caption span{font-size:.72rem;opacity:.82}
    .mini-mark{width:46px;height:64px;object-fit:contain;filter:brightness(0) invert(1)}
    .section{padding:66px 0}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
    h2{font-family:var(--font-display);font-size:clamp(2rem,9vw,3.8rem);line-height:1.08;letter-spacing:-.055em;margin-bottom:8px;font-weight:850}
    .section-head p{color:var(--muted);margin:0;max-width:42ch}
    .text-link{border:0;background:transparent;color:var(--sage);font-weight:900;white-space:nowrap;cursor:pointer;padding:10px 0}
    .featured-rail{display:grid;grid-auto-flow:column;grid-auto-columns:84%;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 1px 18px;scrollbar-width:none}
    .featured-rail::-webkit-scrollbar{display:none}
    .feature-card{position:relative;min-height:430px;border:0;border-radius:0;clip-path:polygon(0 0,100% 0,100% 100%,28px 100%,0 calc(100% - 28px));overflow:hidden;background:#e4e5e1;scroll-snap-align:start;box-shadow:none;padding:0;text-align:start}
    .feature-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
    .feature-card:hover img{transform:scale(1.03)}
    .feature-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(19,23,22,.78))}
    .feature-meta{position:absolute;z-index:2;inset-inline:18px;inset-block-end:17px;color:#fff}
    .feature-meta small{display:block;opacity:.75;font-size:.72rem;margin-bottom:5px}.feature-meta h3{font-size:1.45rem;line-height:1.25;margin:0 0 3px}.feature-meta p{font-size:.82rem;opacity:.84;margin:0}.feature-price{position:absolute;z-index:2;inset-inline-end:16px;inset-block-start:16px;background:rgba(246,242,234,.92);color:var(--ink);border-radius:999px;padding:7px 10px;font-weight:850;font-size:.75rem;backdrop-filter:blur(8px)}
    .taste{background:var(--sage-deep);color:#fff;overflow:hidden;position:relative}
    .taste::before{display:none}
    .taste .container{position:relative}.taste .landing-eyebrow{color:#f4a491}.taste h2{max-width:12ch}
    .taste p{color:rgba(255,255,255,.72);max-width:48ch}
    .taste-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:28px}
    .taste-chip{position:relative;min-height:112px;padding:16px;border-radius:0;clip-path:polygon(0 0,100% 0,100% 100%,16px 100%,0 calc(100% - 16px));border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.045);color:#fff;text-align:start;cursor:pointer;overflow:hidden}
    .taste-chip:hover{background:rgba(255,255,255,.11)}
    .taste-chip b{display:block;font-size:1.05rem}.taste-chip span{display:block;color:rgba(255,255,255,.62);font-size:.72rem;margin-top:4px}
    .taste-dot{width:34px;height:34px;border-radius:50%;position:absolute;inset-inline-end:12px;inset-block-end:12px;background:var(--dot);box-shadow:inset 0 0 0 8px rgba(255,255,255,.16)}
    .story-grid{display:grid;gap:22px}
    .story-image{position:relative;min-height:390px;border-radius:0;clip-path:polygon(0 0,100% 0,100% 100%,28px 100%,0 calc(100% - 28px));overflow:hidden;background:var(--sage)}
    .story-image img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
    .story-copy{display:flex;flex-direction:column;justify-content:center;padding:8px 0}
    .story-copy p{color:#5d625f;line-height:2;max-width:48ch}
    .quote{font-size:1.22rem;color:var(--sage-deep);font-weight:800;border-inline-start:3px solid var(--orange);padding-inline-start:15px;margin-top:12px}
    .visit-card{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:0;clip-path:polygon(0 0,100% 0,100% 100%,32px 100%,0 calc(100% - 32px));padding:28px;display:grid;gap:30px;position:relative;overflow:hidden}
    .visit-card::after{display:none}
    .visit-card h2{margin-bottom:12px}.visit-card p{max-width:58ch;color:var(--muted)}
    .visit-meta{display:grid;grid-template-columns:1fr;gap:0;position:relative;z-index:2}
    .visit-item{border-top:1px solid var(--line);padding:14px 0}.visit-item small{display:block;color:var(--muted);font-size:.68rem;margin-bottom:4px}.visit-item b{display:block;font-size:.88rem;line-height:1.75}.visit-socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.visit-socials a{min-height:42px;border:1px solid var(--line);border-radius:999px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:850}
    footer{padding:42px 0 105px;background:#f4f5f2;color:var(--ink);border-top:1px solid var(--line);margin-top:70px}
    .footer-grid{display:grid;gap:24px}.footer-brand{display:flex;gap:16px;align-items:center}.footer-brand img{width:74px;height:76px;object-fit:contain}.footer-brand p{margin:0;color:var(--muted);font-size:.72rem;letter-spacing:.12em}.footer-note{font-size:.78rem;color:var(--muted);max-width:58ch}.footer-links{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}.footer-links a{font-size:.76rem;font-weight:850;border-bottom:1px solid currentColor}
    .bottom-nav{position:fixed;z-index:58;inset-inline:12px;inset-block-end:var(--safe-bottom);height:64px;border-radius:22px;background:rgba(35,38,37,.94);color:#fff;display:grid;grid-template-columns:repeat(3,1fr);padding:5px;box-shadow:0 18px 44px rgba(0,0,0,.25);backdrop-filter:blur(16px)}
    .bottom-nav button{border:0;background:transparent;color:rgba(255,255,255,.62);border-radius:17px;cursor:pointer;font-size:.7rem;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
    .bottom-nav button.active{background:#fff;color:var(--ink)}.bottom-nav svg{width:19px;height:19px}

    /* Menu */
    .menu-view{padding-bottom:110px}
    .menu-intro{padding:30px 0 18px}
    .menu-intro-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.menu-intro h1{font-size:clamp(2.75rem,14vw,5.6rem);margin-bottom:8px}.menu-intro p{color:var(--muted);margin:0}
    .menu-count{display:none;color:var(--muted);font-size:.8rem}
    .menu-tools{position:sticky;top:70px;z-index:45;background:rgba(252,252,250,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:10px 0 12px}
    .search-wrap{position:relative}.search-wrap svg{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);width:20px;color:var(--muted)}
    .search{width:100%;height:52px;border:1px solid rgba(35,38,37,.24);border-radius:0;background:#fff;padding:0 15px;padding-inline-start:48px;color:var(--ink);box-shadow:none;line-height:1.4}

async function loadCatalog() {

    try {
      catalog = JSON.parse(localStorage.getItem("zaal-catalog")) || clone(SEED);
    } catch {
      catalog = clone(SEED);
    }
    catalogRevision = 1;
    catalogSource = "file";
    return;
  }
  try {
    const response = await fetch("/api/catalog", {
      headers: { accept: "application/json" },
      cache: "no-store",
    });
    const data = await response.json().catch(() => null);
    if (!response.ok || !data?.ok || !data.catalog)
      throw new Error(
        data?.error?.message || `Catalog HTTP ${response.status}`,
      );
    catalog = data.catalog;
    catalogRevision = Number(data.revision) || 1;
    catalogUpdatedAt = data.updatedAt || null;
    catalogSource = "api";
    writeCatalogCache();
  } catch (error) {
    console.error("catalog_load_failed", error);
    const cached = readCatalogCache();
    if (cached) {
      catalog = cached.catalog;
      catalogRevision = Number(cached.revision) || 1;
      catalogUpdatedAt = cached.updatedAt || null;
      catalogSource = "cache";
    } else {
      catalog = clone(SEED);
      catalogRevision = 1;
      catalogUpdatedAt = null;
      catalogSource = "seed";
    }
  }
}
async function save(msg) {
  if (location.protocol === "file:") {
    localStorage.setItem("zaal-catalog", JSON.stringify(catalog));
    if (msg) toast(msg);
    return true;
  }
  try {
    const response = await fetch("/admin/api/catalog", {
      method: "PUT",
      credentials: "same-origin",
      headers: {
        accept: "application/json",
        "content-type": "application/json",
      },
      body: JSON.stringify({ catalog, revision: catalogRevision }),
    });
    const data = await response.json().catch(() => null);
    if (response.status === 401) {
      toast("نشست مدیریت منقضی شده؛ صفحه دوباره باز می‌شود.");
      setTimeout(() => location.reload(), 700);
      return false;
    }
    if (response.status === 409) {
      toast(
        "داده‌ها در نشست دیگری تغییر کرده‌اند؛ صفحه دوباره بارگذاری می‌شود.",
      );
      setTimeout(() => location.reload(), 900);
      return false;
    }
    if (!response.ok || !data?.ok)
      throw new Error(data?.error?.message || `Save HTTP ${response.status}`);
    catalogRevision = Number(data.revision) || catalogRevision + 1;
    catalogUpdatedAt = data.updatedAt || null;
    catalogSource = "api";
    writeCatalogCache();
    if (msg) toast(msg);
    return true;
  } catch (error) {
    console.error("catalog_save_failed", error);
    toast("ذخیره روی سرور انجام نشد؛ دوباره تلاش کنید.");
    return false;
  }
}
function toast(s) {

function esc(s) {

    (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[

  );
}

}
function parseNum(v) {
  return (
    Number(
      String(v)
        .replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d))
        .replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d))
        .replace(/[^0-9]/g, ""),

}
function norm(v) {

    .replace(/[يى]/g, "ی")

py"><span class="landing-eyebrow" >${l==="fa"?`روایت زال`:`The story of Zaal`}</span><h2 >${l==="fa"?`دوزی روزانه از افسانه‌ها.`:`A daily dose of legends.`}</h2><p class="story-short" >${l==="fa"?`زالِ جوان در روایت ما، از دل شاهنامه به سپاهان آمده تا برای آدم‌های امروز، دوزی روزانه از افسانه‌ها بسازد.`:`In our story, young Zaal travels from the heart of the Shahnameh to Sepahan (modern-day Isfahan) to brew a daily dose of legends for today's people.`}</p><p class="story-body" >${l==="fa"?`می‌گویند زال با مویی سپید زاده شد؛ سیمرغ او را در پناهِ خود گرفت، بزرگ کرد و خرد آموخت. در روایت ما، زالِ جوان پس از فرود آمدن در سپاهان، به‌جای کاخ‌نشینی، پاتوقی ساخت برای آدم‌های امروز؛ گوشه‌ای دنج در دل شهر، جایی که عطر قهوه با جادوی اسطوره می‌آمیزد. اینجا هر فنجان، مکثی کوتاه از شتابِ روزمرگی است و دوزی از افسانه برای جان گرفتن در شلوغیِ زندگی. این بازخوانیِ تاریخ نیست؛ روایت آزاد «زال کافه» است.`:`Legend has it that Zaal was born with snow-white hair; Simurgh took him under her wing, raised him, and passed down ancient wisdom. In our story, young Zaal arrived in Sepahan and, instead of retreating to a palace, built a hangout for modern souls—a cozy sanctuary in the heart of the city where the aroma of coffee meets the magic of myth. Here, every cup is a brief pause from the daily rush and a dose of legend to spark life into the hustle. This isn't history; it's a reimagining by Zaal Cafe.`}</p><div class="story-meaning"><strong >${l==="fa"?`نام زال`:`The name Zaal`}</strong><p >${l==="fa"?`زال نام پدر رستم، پهلوان اسطوره‌ای در شاهنامهٔ فردوسی است.`:`Zaal is the father of Rostam, the legendary hero of Ferdowsi's Shahnameh.`}</p></div></div></div>

function filters(q) {
  return {
    q: q.get("q") || "",
    cat: q.get("category") || "all",
    taste: (q.get("taste") || "").split(",").filter(Boolean),
    palate: (q.get("palate") || "").split(",").filter(Boolean),
    available: q.get("available") === "1",
  };
}
function filterQuery(f) {
  const q = new URLSearchParams();
  if (f.q) q.set("q", f.q);
  if (f.cat !== "all") q.set("category", f.cat);
  if (f.taste.length) q.set("taste", f.taste);
  if (f.palate.length) q.set("palate", f.palate);
  if (f.available) q.set("available", "1");
  return q;
}
function filtered(f, l) {
  const q = norm(f.q);
  return catalog.products
    .filter((p) => p.status !== "hidden")
    .filter((p) => !f.available || p.status === "available")
    .filter((p) => f.cat === "all" || p.categoryId === f.cat)
    .filter(
      (p) => !f.taste.length || f.taste.every((x) => p.tasteTags.includes(x)),
    )
    .filter(
      (p) =>
        !f.palate.length || f.palate.every((x) => p.palateTags.includes(x)),
    )
    .filter((p) => {
      const c = cat(p.categoryId),
        hay = [
          p.i.fa.n,
          p.i.en.n,
          p.i.fa.s,
          p.i.en.s,
          p.i.fa.d,
          p.i.en.d,
          ...p.aliases,
          ...p.tasteTags.map((x) => tx("taste", x, l)),
          ...p.palateTags.map((x) => tx("palate", x, l)),
          c.fa,
          c.en,
        ].join(" ");
      return !q || norm(hay).includes(q);
    })
    .sort(
      (a, b) =>
        (a.status === "sold_out") - (b.status === "sold_out") ||
        a.sortOrder - b.sortOrder,
    );
}
function results(l) {
  const c = COPY[l],
    list = filtered(ui.filters, l);
  if (!list.length)
    return `<div class="empty"><h2>${c.noneFound}</h2><button class="btn dark" data-action="clear">${c.clear}</button></div>`;
  return catalog.categories
    .slice()
    .sort((a, b) => a.order - b.order)
    .map((x) => {
      const group = list.filter((p) => p.categoryId === x.id);
      return group.length
        ? `<section class="category"><div class="cat-head"><div><h2>${esc(x[l])}</h2><p>${esc(x[l + "Desc"])}</p></div><span>${digits(group.length, l)} ${c.items}</span></div><div class="product-list">${group.map((p) => productCard(p, l)).join("")}</div></section>`
        : "";
    })
    .join("");
}

    s = catalog.products.filter((p) => p.status === "sold_out").length,
    h = catalog.products.filter((p) => p.status === "hidden").length;
  app.innerHTML = `<div class="admin"><header class="admin-head"><div class="wrap"><b>زال / Zaal · <span>پنل زنده</span></b><div class="actions"><a class="btn" href="/fa/menu/" target="_blank" rel="noopener noreferrer">پیش‌نمایش</a></div></div></header><main class="wrap admin-main"><div class="admin-title"><div><div class="eyebrow">Cloudflare D1 CMS</div><h1>مدیریت منو</h1><p class="muted">متصل به پایگاه داده؛ تغییرات ذخیره‌شده برای همهٔ بازدیدکنندگان اعمال می‌شوند.</p></div><div class="actions"><button class="btn" data-action="categories">مدیریت دسته‌ها</button><button class="btn orange" data-action="add">افزودن محصول</button></div></div><div class="stats"><div class="stat"><b>${digits(catalog.products.length, "fa")}</b><span>همه</span></div><div class="stat"><b>${digits(a, "fa")}</b><span>موجود</span></div><div class="stat"><b>${digits(s, "fa")}</b><span>ناموجود</span></div><div class="stat"><b>${digits(h, "fa")}</b><span>پنهان</span></div></div><div class="notice">${catalogSource === "api" ? `متصل به پایگاه داده D1 · نسخهٔ ${digits(catalogRevision, "fa")} · آخرین ذخیره برای همه قابل مشاهده است.` : "هشدار: داده‌ها از نسخهٔ پشتیبان نمایش داده می‌شوند؛ اتصال API را بررسی کنید."}</div><div class="notice">سیاست Reset خودکار Sold out هنوز تعیین نشده؛ تغییر وضعیت فعلاً فقط دستی است.</div><div class="admin-toolbar"><div class="admin-helper">هر ذخیره روی قیمت، وضعیت یا ویرایش محصول، منوی زنده را به‌روزرسانی می‌کند. «بازگردانی منوی مرجع» کل فهرست را با نسخهٔ مرجع ۵۹ محصولی جایگزین می‌کند. «پیش‌نمایش عمومی» در تب جدید باز می‌شود.</div>${adminCategoryBar()}</div><h2>محصولات</h2><div id="admin-list">${adminRows()}</div></main></div><dialog class="editor" id="editor"></dialog><dialog class="editor" id="category-editor"></dialog><dialog class="editor" id="confirm"></dialog>`;
}
function blank() {
  return {
    id: `new-${Date.now()}`,
    slug: `new-${Date.now()}`,
    categoryId: catalog.categories[0].id,
    sortOrder: Date.now(),
    status: "hidden",
    price: 200000,
    priceVariants: [],
    currency: "TOMAN",
    i: {
      fa: { n: "", s: "", d: "", g: "" },
      en: { n: "", s: "", d: "", g: "" },
    },
    aliases: [],
    tasteTags: [],
    palateTags: [],
    profile: [2, 2, 2, 2],
    temperature: "hot",
    caffeine: "medium",
    allergens: [],
    dietary: [],
    art: ["#5E716B", "#FFFFFF", "#E35335"],
    kind: "cup",
    featured: false,
  };
}
function editor(id) {
  ui.editing = clone(id ? catalog.products.find((x) => x.id === id) : blank());
  const p = ui.editing,
    d = document.getElementById("editor");
  d.innerHTML = `<div class="sheet-head"><h2>${id ? `ویرایش ${esc(p.i.fa.n)}` : "محصول جدید"}</h2><button class="close" data-close="editor">×</button></div><form class="editor-body" id="product-form"><div class="tabs"><button class="on" type="button" data-tab="fa">FA · فارسی</button><button type="button" data-tab="en">EN · English</button></div>${["fa", "en"].map((l, i) => `<div class="fields" data-panel="${l}" ${i ? "hidden" : ""}><div class="field"><label>نام</label><input name="${l}n" value="${esc(p.i[l].n)}" required></div><div class="field"><label>روایت یک‌خطی</label><input name="${l}s" value="${esc(p.i[l].s)}"></div><div class="field full"><label>شرح</label><textarea name="${l}d">${esc(p.i[l].d)}</textarea></div><div class="field full"><label>محتویات</label><textarea name="${l}g">${esc(p.i[l].g)}</textarea></div></div>`).join("")}<div class="fields"><div class="field"><label>دسته</label><select name="category">${catalog.categories.map((x) => `<option value="${x.id}" ${p.categoryId === x.id ? "selected" : ""}>${esc(x.fa)}</option>`).join("")}</select></div><div class="field"><label>وضعیت</label><select name="status"><option value="available" ${p.status === "available" ? "selected" : ""}>موجود</option><option value="sold_out" ${p.status === "sold_out" ? "selected" : ""}>ناموجود</option><option value="hidden" ${p.status === "hidden" ? "selected" : ""}>پنهان</option></select></div><div class="field"><label>قیمت تومان</label><input name="price" value="${p.price}" dir="ltr"></div></div><div class="group"><h3>مزه‌ها</h3><div class="checks">${catalog.taste.map((x) => `<label><input name="taste" type="checkbox" value="${x[0]}" ${p.tasteTags.includes(x[0]) ? "checked" : ""}> ${x[1]}</label>`).join("")}</div></div><div class="group"><h3>ذائقه‌ها</h3><div class="checks">${catalog.palate.map((x) => `<label><input name="palate" type="checkbox" value="${x[0]}" ${p.palateTags.includes(x[0]) ? "checked" : ""}> ${x[1]}</label>`).join("")}</div></div></form><div class="sheet-foot"><button class="btn" data-close="editor">انصراف</button><button class="btn orange" type="submit" form="product-form">ذخیره محصول</button></div>`;
  d.showModal();
}
function categoryEditor() {
  const d = document.getElementById("category-editor");
  d.innerHTML = `<div class="sheet-head"><h2>دسته‌بندی‌ها</h2><button class="close" data-close="category-editor">×</button></div><div class="editor-body">${catalog.categories
    .sort((a, b) => a.order - b.order)
    .map(
      (x) =>
        `<div class="fields"><div class="field"><label>فارسی</label><input data-cat-fa="${x.id}" value="${esc(x.fa)}"></div><div class="field"><label>English</label><input data-cat-en="${x.id}" value="${esc(x.en)}" dir="ltr"></div></div>`,
    )
    .join(
      "",
    )}</div><div class="sheet-foot"><button class="btn" data-action="add-category">+ دسته</button><button class="btn orange" data-action="save-categories">ذخیره دسته‌ها</button></div>`;
  d.showModal();
}
document.addEventListener("click", async (e) => {
  const r = e.target.closest("[data-route]");
  if (r) {
    e.preventDefault();
    go(r.dataset.route);
    return;
  }
  const cl = e.target.closest("[data-close]");
  if (cl) {
    document.getElementById(cl.dataset.close)?.close();
    return;
  }
  const p = e.target.closest("[data-product]");
  if (p) {
    detail(p.dataset.product);
    return;
  }
  const tg = e.target.closest("[data-go-taste]");
  if (tg) {
    go(`/${ui.l}/menu/?taste=${tg.dataset.goTaste}`);
    return;
  }
  const q = e.target.closest("[data-quick]");
  if (q) {
    const id = q.dataset.quick;
    ui.filters.taste = ui.filters.taste.includes(id)
      ? ui.filters.taste.filter((x) => x !== id)
      : [...ui.filters.taste, id];
    refreshMenu();
    return;
  }
  const ct = e.target.closest("[data-cat]");
  if (ct) {
    ui.filters.cat = ct.dataset.cat;
    refreshMenu();
    return;
  }
  const df = e.target.closest("[data-draft]");
  if (df) {
    const k = df.dataset.draft,
      id = df.dataset.value;
    ui.draft[k] = ui.draft[k].includes(id)
      ? ui.draft[k].filter((x) => x !== id)
      : [...ui.draft[k], id];
    document.getElementById("filter").innerHTML = sheet();
    return;
  }
  const adminCat = e.target.closest("[data-admin-cat]");
  if (adminCat) {
    ui.adminCategory = adminCat.dataset.adminCat;
    admin();
    return;
  }
  const a = e.target.closest("[data-action]")?.dataset.action;
  if (a === "filters") {
    openFilters();
    return;
  }
  if (a === "clear") {
    ui.filters = { q: "", cat: "all", taste: [], palate: [], available: false };
    const x = document.getElementById("menu-search");
    if (x) x.value = "";
    refreshMenu();
    return;
  }
  if (a === "reset-filters") {
    ui.draft = { ...ui.draft, taste: [], palate: [], available: false };
    document.getElementById("filter").innerHTML = sheet();
    return;
  }
  if (a === "apply-filters") {
    ui.draft.available =
      document.getElementById("available-only")?.checked || false;
    ui.filters = clone(ui.draft);
    document.getElementById("filter").close();
    refreshMenu();
    return;
  }
  if (a === "add") {
    editor();
    return;
  }
  if (a === "categories") {
    categoryEditor();
    return;
  }
  if (a === "reset-seed") {
    const d = document.getElementById("confirm");
    d.innerHTML =
      '<div class="sheet-head"><h2>بازگردانی منوی مرجع؟</h2><button class="close" data-close="confirm">×</button></div><div class="editor-body"><p>کل کاتالوگ فعلی با نسخهٔ مرجع ۵۹ محصولی جایگزین می‌شود. این کار برای اصلاحات گسترده یا شروع دوباره است؛ نسخهٔ قبلی در تاریخچهٔ D1 می‌ماند.</p></div><div class="sheet-foot"><button class="btn" data-close="confirm">انصراف</button><button class="btn orange" data-action="confirm-reset">بازگردانی و ذخیره</button></div>';
    d.showModal();
    return;
  }
  if (a === "confirm-reset") {
    const previous = clone(catalog);
    catalog = clone(SEED);
    if (await save("منوی واقعی در پایگاه داده ذخیره شد")) {
      document.getElementById("confirm").close();
      admin();
    } else catalog = previous;
    return;
  }
  if (a === "add-category") {
    catalog.categories.push({
      id: `cat-${Date.now()}`,
      order: catalog.categories.length + 1,
      fa: "دسته جدید",
      en: "New category",
      faDesc: "",
      enDesc: "",
    });
    document.getElementById("category-editor").close();
    categoryEditor();
    return;
  }
  if (a === "save-categories") {
    const previous = clone(catalog);
    document
      .querySelectorAll("[data-cat-fa]")
      .forEach(
        (i) =>
          (cat(i.dataset.catFa).fa = i.value.trim() || cat(i.dataset.catFa).fa),
      );
    document
      .querySelectorAll("[data-cat-en]")
      .forEach(
        (i) =>
          (cat(i.dataset.catEn).en = i.value.trim() || cat(i.dataset.catEn).en),
      );
    if (await save("دسته‌بندی‌ها در پایگاه داده ذخیره شدند")) {
      document.getElementById("category-editor").close();
      admin();
    } else catalog = previous;
    return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed) {
    editor(ed.dataset.edit);
    return;
  }
  const du = e.target.closest("[data-duplicate]");
  if (du) {
    const previous = clone(catalog),
      src = catalog.products.find((x) => x.id === du.dataset.duplicate),
      copy = clone(src);
    copy.id = `${src.id}-copy-${Date.now()}`;
    copy.slug = copy.id;
    copy.i.fa.n += " — کپی";
    copy.i.en.n += " — Copy";
    copy.status = "hidden";
    copy.sortOrder += 0.1;
    catalog.products.push(copy);
    if (await save("نسخهٔ مشابه ساخته و در پایگاه داده پنهان شد")) admin();
    else catalog = previous;
    return;
  }
  const sp = e.target.closest("[data-save-price]");
  if (sp) {
    const p = catalog.products.find((x) => x.id === sp.dataset.savePrice),
      v = parseNum(document.getElementById(`price-${p.id}`).value),
      previous = p.price;
    if (v <= 0) {
      toast("قیمت معتبر وارد کنید");
      return;
    }
    p.price = v;
    if (await save(`قیمت «${p.i.fa.n}» در پایگاه داده ذخیره شد`))
      document.getElementById(`price-${p.id}`).value = digits(v, "fa");
    else p.price = previous;
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    document
      .querySelectorAll("[data-panel]")
      .forEach((x) => (x.hidden = x.dataset.panel !== tab.dataset.tab));
    document
      .querySelectorAll("[data-tab]")
      .forEach((x) =>
        x.classList.toggle("on", x.dataset.tab === tab.dataset.tab),
      );
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "menu-search") {
    ui.filters.q = e.target.value;
    refreshMenu();
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.matches("[data-status]")) {
    const p = catalog.products.find((x) => x.id === e.target.dataset.status),
      previous = p.status;
    p.status = e.target.value;
    if (!(await save(`وضعیت «${p.i.fa.n}» در پایگاه داده تغییر کرد`))) {
      p.status = previous;
      e.target.value = previous;
    }
  }
});
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "product-form") return;
  e.preventDefault();
  const previous = clone(catalog),
    f = e.target,
    p = ui.editing;
  for (const l of ["fa", "en"])
    for (const k of ["n", "s", "d", "g"])
      p.i[l][k] = f.elements[l + k].value.trim();
  p.categoryId = f.elements.category.value;
  p.status = f.elements.status.value;
  p.price = parseNum(f.elements.price.value);
  p.tasteTags = [...f.querySelectorAll('input[name="taste"]:checked')].map(
    (x) => x.value,
  );
  p.palateTags = [...f.querySelectorAll('input[name="palate"]:checked')].map(
    (x) => x.value,
  );
  p.aliases = [
    ...new Set([...(p.aliases || []), p.i.fa.n, p.i.en.n].filter(Boolean)),
  ];
  const i = catalog.products.findIndex((x) => x.id === p.id);
  if (i >= 0) catalog.products[i] = p;
  else catalog.products.push(p);
  if (await save("محصول در پایگاه داده ذخیره شد")) {
    document.getElementById("editor").close();
    admin();
  } else catalog = previous;
});
function render() {
  const r = route();
  if (r.p === "/") {
    go(`/${localStorage.getItem("zaal-lang") || "fa"}/`);
    return;
  }
  if (r.p === "/admin/") {
    admin();
    return;
  }
  const l = lang(r.p);
  if (r.p === `/${l}/menu/`) menu(l, r.p, r.q);
  else landing(l, `/${l}/`, r.q);
}
window.addEventListener("popstate", render);
window.addEventListener("hashchange", render);
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("/sw.js").catch(() => {});
loadCatalog().finally(() => render());

</script></body></html>
