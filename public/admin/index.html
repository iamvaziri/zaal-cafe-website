<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5E716B">
  <meta name="robots" content="noindex,nofollow">
  <title>زال کافه | پنل ادمین</title>
  <link rel="preload" href="/assets/fonts/vazirmatn-variable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face{font-family:'Vazirmatn';src:url('/assets/fonts/vazirmatn-variable.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:swap}
    :root{--g:#5E716B;--o:#E35335;--w:#fff;--m:#f5f5f2;--x:#404040;--line:rgba(0,0,0,.14);--danger:#b5442e;--dangerBg:#fff3f0;--max:1200px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--m);color:#111;font:15px/1.8 'Vazirmatn','Noto Sans Arabic',Tahoma,Arial,sans-serif}
    button,input,textarea,select{font:inherit;font-family:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
    [hidden]{display:none!important}.wrap{width:min(calc(100% - 2rem),var(--max));margin:auto}
    .btn{min-height:44px;border:1px solid #000;background:#fff;padding:.55rem .9rem;display:inline-flex;align-items:center;justify-content:center;font-weight:800;border-radius:12px;white-space:nowrap}
    .btn.orange{background:var(--o);border-color:var(--o);color:#fff}.btn.dark{background:#111;color:#fff;border-color:#111}.btn.danger{background:var(--dangerBg);border-color:#d9b0a7;color:var(--danger)}
    .btn.ghost{background:transparent}.admin-head{position:sticky;top:0;z-index:50;background:#111;color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
    .admin-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:72px;padding:.8rem 0}.brand{font-weight:900}.brand small{display:block;font-size:.72rem;color:rgba(255,255,255,.72)}
    .actions{display:flex;gap:.55rem;flex-wrap:wrap}.actions form{margin:0}.main{padding:2rem 0 5rem}.hero{display:flex;justify-content:space-between;gap:1rem;align-items:flex-end;flex-wrap:wrap}.hero h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;margin:.2rem 0}.hero p{margin:.4rem 0 0;color:#666}
    .notice{margin:1rem 0;background:#faf8f4;border:1px solid var(--line);padding:.85rem 1rem;border-radius:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:1.25rem 0}
    .stat{background:#fff;padding:1rem}.stat b{display:block;font-size:1.8rem;font-weight:900;font-variant-numeric:tabular-nums}.toolbar{display:grid;gap:1rem;margin:1rem 0 1.5rem}.helper{background:#fff;border:1px solid var(--line);padding:.85rem 1rem;border-radius:16px;font-size:.92rem;color:#555}
    .chips{display:flex;gap:.5rem;flex-wrap:wrap}.chips button{min-height:44px;border:1px solid var(--line);border-radius:999px;background:#fff;padding:.35rem .85rem;font-weight:800}.chips button.active{background:var(--g);color:#fff;border-color:var(--g)}
    .section{margin:1.3rem 0 1.8rem}.section-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:.7rem 0}.section-head h2,.section-head h3{margin:0}.section-head span{font-size:.85rem;color:#666}
    .row{display:grid;grid-template-columns:80px minmax(0,1fr) 140px 220px auto;gap:.65rem;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:.75rem;margin:.6rem 0}
    .thumb,.thumb-fallback{width:80px;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#e8e8e8}.thumb img{width:100%;height:100%;object-fit:cover}.thumb-fallback{display:grid;place-items:center;font-weight:900;color:#666}
    .row h3{margin:0 0 .25rem;font-size:1rem}.row p{margin:0;color:#666;font-size:.82rem}.field-inline{display:flex;gap:.4rem;align-items:center}.field-inline input{flex:1}
    input,textarea,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:.6rem .75rem;background:#fff}.row-actions{display:flex;gap:.35rem;flex-wrap:wrap}.row-actions button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff}.row-actions button[data-delete-product]{border-color:#d9b0a7;background:var(--dangerBg);color:var(--danger)}
    dialog{border:0;padding:0;border-radius:24px;max-width:none;box-shadow:0 24px 64px rgba(0,0,0,.24)}dialog::backdrop{background:rgba(0,0,0,.45)}
    .sheet{width:min(900px,calc(100% - 1rem));max-height:92svh;overflow:auto;background:#fff}.sheet-head,.sheet-foot{position:sticky;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.2rem;background:#fff}.sheet-head{top:0;border-bottom:1px solid var(--line)}.sheet-foot{bottom:0;border-top:1px solid var(--line)}.sheet-body{padding:1.2rem}
    .close{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.2rem}.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.grid .full{grid-column:1/-1}.field{display:grid;gap:.35rem}.field label{font-size:.78rem;font-weight:900}.checks{display:flex;gap:.6rem;flex-wrap:wrap}.checks label{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .65rem;border:1px solid var(--line);border-radius:999px;background:#fff}.category-row{display:grid;grid-template-columns:1fr 1fr auto;gap:1rem;align-items:end;margin-top:1rem}
    .muted{color:#666}.taste-help{margin:0;font-size:.8rem}.taste-hint{margin:.2rem 0 0;min-height:1.4em;font-size:.85rem;font-weight:800;color:#333}.checks input:disabled+*{opacity:.5}.checks label:has(input:disabled){opacity:.45}.empty{padding:2rem;border:1px dashed var(--line);border-radius:18px;background:#fff;text-align:center;color:#666}.toast-box{position:fixed;left:1rem;bottom:1rem;z-index:80;display:grid;gap:.5rem;justify-items:start;max-width:calc(100% - 2rem)}.toast{background:#111;color:#fff;padding:.85rem 1rem;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
    @media (max-width:900px){.row{grid-template-columns:72px minmax(0,1fr) auto}.row select,.row .field-inline,.row .row-actions{grid-column:2/-1}.grid{grid-template-columns:1fr}.category-row{grid-template-columns:1fr}}
    @media (max-width:640px){.admin-head .wrap{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:64px minmax(0,1fr)}.row .row-actions{grid-column:1/-1}.thumb,.thumb-fallback{width:64px}.sheet{width:100%;height:100svh;max-height:100svh;border-radius:0}}
  .checks input[type=checkbox]{width:auto;min-height:0;flex:none}.taste-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:1rem;padding:1rem 0;border-top:1px solid var(--line)}.taste-row:first-of-type{border-top:0}.taste-img{width:96px;height:96px;border-radius:16px;overflow:hidden;background:#e8e8e8}.taste-img img{width:100%;height:100%;object-fit:cover}.taste-meta{font-size:.8rem;color:#666;margin-top:.35rem}.taste-warn{color:var(--danger)}.taste-fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.taste-fields .full{grid-column:1/-1}@media (max-width:640px){.taste-row{grid-template-columns:1fr}.taste-fields{grid-template-columns:1fr}}
  :focus-visible{outline:3px solid var(--o);outline-offset:2px}.admin-head :focus-visible,.toast :focus-visible{outline-color:#fff}
  .sheet-foot{flex-wrap:wrap}.filters{display:grid;gap:.8rem}.filters .chips{align-items:center}.chips .n{font-variant-numeric:tabular-nums;opacity:.8;font-weight:700}
  .filter-foot{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;min-height:44px}.filter-foot [role=status]{font-weight:800;color:#444}
  .empty .btn{margin-top:.75rem}.badge{display:inline-block;margin:.3rem 0 0 .3rem;padding:.05rem .6rem;border-radius:999px;font-size:.72rem;font-weight:800}.badge.warn{background:#fff3d6;color:#7a4f00;border:1px solid #ecd49a}
  .toast.undo{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}.undo-btn{min-height:44px;min-width:44px;padding:.4rem .95rem;border:1px solid rgba(255,255,255,.6);border-radius:12px;background:transparent;color:#fff;font-weight:800}.undo-btn:disabled{opacity:.6}
  .tabs{display:flex;gap:.4rem;margin:0 0 1rem;border-bottom:1px solid var(--line)}.tabs button{min-height:44px;border:0;border-bottom:3px solid transparent;background:transparent;padding:.4rem .95rem;font-weight:800;color:#555}.tabs button[aria-selected=true]{color:#111;border-bottom-color:var(--o)}.tab-flag{font-size:.74rem;font-weight:700;color:#7a4f00}.tab-flag:not(:empty)::before{content:'· '}
  .field-hint{margin:0;font-size:.8rem;color:#7a4f00}.form-sub{margin:1.6rem 0 .8rem;font-size:1rem}.form-msg{flex:1 1 100%;order:-1;background:var(--dangerBg);color:var(--danger);border:1px solid #d9b0a7;border-radius:12px;padding:.6rem .85rem;font-weight:700}
  .cat-item{border-top:1px solid var(--line);padding:.2rem 0 .9rem}.cat-item:first-of-type{border-top:0}.cat-actions{display:flex;gap:.4rem;align-items:center}.btn.icon{min-width:44px;padding:.4rem}.btn:disabled{opacity:.4;cursor:default}.cat-meta{margin:.5rem 0 0;font-size:.82rem}.cat-meta code{background:#f0f0ec;padding:.05rem .4rem;border-radius:6px}
  @media (max-width:640px){.filter-foot{align-items:stretch}.toast.undo{align-items:stretch}.undo-btn{flex:1}}
  </style>
</head>
<body>
  <header class="admin-head">
    <div class="wrap">
      <div class="brand">زال / Zaal <small>پنل مدیریت منو</small></div>
      <div class="actions">
        <a class="btn ghost" href="/fa/menu/" target="_blank" rel="noopener noreferrer">پیش‌نمایش منو</a>
        <form method="post" action="/admin/logout"><button class="btn" type="submit">خروج</button></form>
      </div>
    </div>
  </header>
  <main class="wrap main" id="app"></main>
  <div class="toast-box"><div id="toastBox" role="status" aria-live="polite"></div><div id="undoBox" role="status" aria-live="polite"></div></div>
  <dialog class="sheet" id="editor"></dialog>
  <dialog class="sheet" id="categoryEditor"></dialog>
  <dialog class="sheet" id="tasteEditor"></dialog>
  <dialog class="sheet" id="confirm"></dialog>
  <script>
  const ADMIN_CACHE_KEY='zaal-admin-catalog-cache-v2';
  const TASTE_DESC={'sweet':'یک خوشی شیرین','bitter':'عمیق و پرشخصیت','tangy':'زنده، شاداب و کمی ترش','savory':'نمکی و سیرکننده','fruity':'شاد و آبدار','chocolate-caramel':'عمیق، شیرین و دلگرم‌کننده','nutty-roasted':'گرم و برشته','herbal-floral':'سبز، معطر و آرام','spiced-aromatic':'گرم و پرعطر','creamy-smooth':'نرم و لطیف','light-refreshing':'سبک و دلنشین','crisp-crunchy':'ترد و قرچ'};
  const TASTE_DEFAULTS={"sweet":{"fa":"شیرین","en":"Sweet","faDesc":"یک خوشی شیرین","enDesc":"A sweet treat","img":"/assets/tastes/sweet-720.webp"},"bitter":{"fa":"تلخ","en":"Bitter","faDesc":"عمیق و پرشخصیت","enDesc":"Strong and bold","img":"/assets/tastes/bitter-720.webp"},"tangy":{"fa":"ترش و تازه","en":"Sour & fresh","faDesc":"زنده، شاداب و کمی ترش","enDesc":"Fresh, lively and a little sour","img":"/assets/tastes/tangy-720.webp"},"savory":{"fa":"شور و خوش‌طعم","en":"Salty & savory","faDesc":"نمکی و سیرکننده","enDesc":"Salty and filling","img":"/assets/tastes/savory-720.webp"},"fruity":{"fa":"میوه‌ای","en":"Fruity","faDesc":"شاد و آبدار","enDesc":"Juicy and fresh","img":"/assets/tastes/fruity-720.webp"},"chocolate-caramel":{"fa":"شکلاتی و کاراملی","en":"Chocolate & caramel","faDesc":"عمیق، شیرین و دلگرم‌کننده","enDesc":"Rich, sweet and comforting","img":"/assets/tastes/chocolate-720.webp"},"nutty-roasted":{"fa":"آجیلی و برشته","en":"Nutty & roasted","faDesc":"گرم و برشته","enDesc":"Warm and toasty","img":"/assets/tastes/nutty-720.webp"},"herbal-floral":{"fa":"گیاهی و گلی","en":"Herbal & floral","faDesc":"سبز، معطر و آرام","enDesc":"Fresh and fragrant","img":"/assets/tastes/herbal-720.webp"},"spiced-aromatic":{"fa":"ادویه‌ای و معطر","en":"Spiced & fragrant","faDesc":"گرم و پرعطر","enDesc":"Warm and fragrant","img":"/assets/tastes/spiced-720.webp"},"creamy-smooth":{"fa":"خامه‌ای و نرم","en":"Creamy & smooth","faDesc":"نرم و لطیف","enDesc":"Soft and silky","img":"/assets/tastes/creamy-720.webp"},"light-refreshing":{"fa":"سبک و خنک","en":"Light & refreshing","faDesc":"سبک و دلنشین","enDesc":"Light and cool","img":"/assets/tastes/refreshing-720.webp"},"crisp-crunchy":{"fa":"ترد و کرانچی","en":"Crisp & crunchy","faDesc":"ترد و قرچ","enDesc":"Crisp with a crunch","img":"/assets/tastes/crisp-720.webp"}};
  const ALLERGEN_OPTIONS=[['gluten','گلوتن'],['dairy','لبنیات'],['nuts','آجیل'],['peanut','بادام‌زمینی'],['egg','تخم‌مرغ'],['sesame','کنجد'],['soy','سویا']];
  const DIETARY_OPTIONS=[['vegetarian','گیاه‌خواری'],['vegan','وگان'],['sugar-free','بدون شکر']];
  const MAX_TASTES=4;
  function syncTasteBoxes(root){const boxes=[...root.querySelectorAll('input[name="taste"]')];const n=boxes.filter(b=>b.checked).length;boxes.forEach(b=>{b.disabled=!b.checked&&n>=MAX_TASTES});const c=root.querySelector('#tasteCount');if(c)c.textContent=`(${digits(n)} از ${digits(MAX_TASTES)})`}
  function showTasteHint(root,input){const hint=root.querySelector('#tasteHint');if(!hint||!input)return;const label=input.closest('label');const id=input.value;hint.textContent=tasteDesc(id)?`«${label.textContent.trim()}»: ${tasteDesc(id)}`:''}
  const EMPTY_CATALOG={version:1,taste:[],palate:[],categories:[],products:[],tasteInfo:{}};
  const app=document.getElementById('app');
  const toastBox=document.getElementById('toastBox');
  let catalog=clone(EMPTY_CATALOG);
  let catalogRevision=1;
  let catalogUpdatedAt=null;
  let catalogSource='empty';
  let ui={adminCategory:'all',editing:null,q:'',status:'all',incomplete:false,catDraft:null};

  function clone(v){return JSON.parse(JSON.stringify(v))}
  function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
  function tasteInfoOf(id){return Object.assign({},TASTE_DEFAULTS[id]||{},Object.fromEntries(Object.entries((catalog.tasteInfo||{})[id]||{}).filter(([,v])=>typeof v==='string'&&v.trim())))}
  function tasteDesc(id){return tasteInfoOf(id).faDesc||''}
  function tasteLabel(item){return tasteInfoOf(item[0]).fa||item[1]}
  function tasteProductCount(id){return catalog.products.filter(p=>p.status!=='hidden'&&(p.tasteTags||[]).includes(id)).length}
  function openTasteEditor(){const dialog=document.getElementById('tasteEditor');const list=(catalog.taste||[]).length?catalog.taste:Object.keys(TASTE_DEFAULTS).map(id=>[id,TASTE_DEFAULTS[id].fa,TASTE_DEFAULTS[id].en]);dialog.innerHTML=`<div class="sheet-head"><h2>مزه‌ها</h2><button class="close" data-close="tasteEditor">×</button></div><div class="sheet-body"><p class="muted">نام و توضیح هر مزه در صفحهٔ اصلی، فیلتر مزه و پنل ادمین نمایش داده می‌شود. اگر فیلدی را خالی بگذاری، مقدار پیش‌فرض استفاده می‌شود. مزه‌ای که محصول فعال نداشته باشد در صفحهٔ اصلی دیده نمی‌شود.</p>${list.map(item=>{const id=item[0];const info=tasteInfoOf(id);const def=TASTE_DEFAULTS[id]||{};const count=tasteProductCount(id);return `<div class="taste-row" data-taste-row="${esc(id)}"><div><div class="taste-img">${def.img?`<img src="${esc(def.img)}" alt="" loading="lazy">`:''}</div></div><div><b>${esc(info.fa||item[1])}</b> <span class="muted" dir="ltr">${esc(id)}</span><div class="taste-meta ${count?'':'taste-warn'}">${count?`${digits(count)} محصول فعال`:'بدون محصول فعال؛ در صفحهٔ اصلی نمایش داده نمی‌شود'}${def.img?` · عکس: <span dir="ltr">${esc(def.img)}</span>`:''}</div><div class="taste-fields"><div class="field"><label>نام فارسی</label><input data-tf="fa" value="${esc(info.fa||'')}" maxlength="120" placeholder="${esc(def.fa||'')}"></div><div class="field"><label>English name</label><input data-tf="en" value="${esc(info.en||'')}" maxlength="120" dir="ltr" placeholder="${esc(def.en||'')}"></div><div class="field"><label>توضیح فارسی</label><input data-tf="faDesc" value="${esc(info.faDesc||'')}" maxlength="200" placeholder="${esc(def.faDesc||'')}"></div><div class="field"><label>English description</label><input data-tf="enDesc" value="${esc(info.enDesc||'')}" maxlength="200" dir="ltr" placeholder="${esc(def.enDesc||'')}"></div></div></div></div>`}).join('')}<p class="muted taste-help">تغییر عکس مزه‌ها فعلاً با جایگزینی فایل عکس در مخزن GitHub انجام می‌شود.</p></div><div class="sheet-foot"><button class="btn" data-close="tasteEditor" type="button">انصراف</button><button class="btn orange" type="button" data-save-tastes>ذخیره مزه‌ها</button></div>`;dialog.showModal()}
  document.addEventListener('click',async event=>{const open=event.target.closest('[data-action="tastes"]');if(open){openTasteEditor();return}const save=event.target.closest('[data-save-tastes]');if(!save)return;const previous=clone(catalog);const info={};document.querySelectorAll('#tasteEditor [data-taste-row]').forEach(row=>{const id=row.dataset.tasteRow;const def=TASTE_DEFAULTS[id]||{};const entry={};row.querySelectorAll('[data-tf]').forEach(input=>{const v=input.value.trim();if(v&&v!==def[input.dataset.tf])entry[input.dataset.tf]=v});if(Object.keys(entry).length)info[id]=entry});catalog.tasteInfo=info;if(await saveCatalog('مزه‌ها ذخیره شد.')){document.getElementById('tasteEditor').close();render()}else catalog=previous});
  function digits(v){return new Intl.NumberFormat('fa-IR').format(Number(v)||0)}
  function money(v){return `${digits(v)} تومان`}
  function parseNum(v){return Number(String(v).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g,''))||0}
  function toast(message){toastBox.innerHTML=`<div class="toast">${message}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>toastBox.innerHTML='',3200)}
  function readCache(){try{return JSON.parse(localStorage.getItem(ADMIN_CACHE_KEY)||'null')}catch(_){return null}}
  function writeCache(){try{localStorage.setItem(ADMIN_CACHE_KEY,JSON.stringify({catalog,revision:catalogRevision,updatedAt:catalogUpdatedAt,savedAt:Date.now()}))}catch(_){}}
  function normalizeCatalog(raw){if(!raw||!Array.isArray(raw.categories)||!Array.isArray(raw.products))return clone(EMPTY_CATALOG);return{version:Number(raw.version)||1,taste:Array.isArray(raw.taste)?raw.taste:[],palate:Array.isArray(raw.palate)?raw.palate:[],categories:raw.categories,products:raw.products,tasteInfo:(raw.tasteInfo&&typeof raw.tasteInfo==='object'&&!Array.isArray(raw.tasteInfo))?raw.tasteInfo:{}}}
  async function loadCatalog(){if(location.protocol==='file:'){const cached=readCache();catalog=normalizeCatalog(cached?.catalog||EMPTY_CATALOG);catalogRevision=Number(cached?.revision)||1;catalogUpdatedAt=cached?.updatedAt||null;catalogSource='file';return}try{const response=await fetch('/admin/api/catalog',{headers:{accept:'application/json'},cache:'no-store',credentials:'same-origin'});if(response.status===401||response.status===403){location.reload();return}const data=await response.json().catch(()=>null);if(!response.ok||!data?.ok||!data.catalog)throw new Error(data?.error?.message||`HTTP ${response.status}`);catalog=normalizeCatalog(data.catalog);catalogRevision=Number(data.revision)||1;catalogUpdatedAt=data.updatedAt||null;catalogSource='api';writeCache()}catch(error){console.error('catalog_load_failed',error);const cached=readCache();catalog=normalizeCatalog(cached?.catalog||EMPTY_CATALOG);catalogRevision=Number(cached?.revision)||1;catalogUpdatedAt=cached?.updatedAt||null;catalogSource=cached?'cache':'empty'}}
  let lastSaveConflict=false;
  function afterSave(message,opts){if(opts.undoBefore)showUndo(message,opts.undoBefore,opts.focusSel);else{if(!opts.keepUndo)clearUndo();if(message&&!opts.quiet)toast(message)}}
  async function saveCatalog(successMessage,opts={}){
    lastSaveConflict=false;
    catalog.version=Number(catalog.version)||1;
    if(location.protocol==='file:'){writeCache();afterSave(successMessage,opts);return true}
    try{
      const response=await fetch('/admin/api/catalog',{method:'PUT',credentials:'same-origin',headers:{accept:'application/json','content-type':'application/json'},body:JSON.stringify({catalog,revision:catalogRevision})});
      const data=await response.json().catch(()=>null);
      if(response.status===401||response.status===403){toast('نشست مدیریت منقضی شده؛ صفحه دوباره باز می‌شود.');setTimeout(()=>location.reload(),700);return false}
      if(response.status===409){lastSaveConflict=true;if(opts.noReload)return false;toast('داده‌ها در نشست دیگری تغییر کرده‌اند؛ صفحه دوباره بارگذاری می‌شود.');setTimeout(()=>location.reload(),900);return false}
      if(!response.ok||!data?.ok)throw new Error(data?.error?.message||`HTTP ${response.status}`);
      catalogRevision=Number(data.revision)||catalogRevision+1;catalogUpdatedAt=data.updatedAt||null;catalogSource='api';writeCache();
      afterSave(successMessage,opts);return true
    }catch(error){console.error('catalog_save_failed',error);toast('ذخیره روی سرور انجام نشد؛ دوباره تلاش کنید.');return false}
  }

    const previous=clone(catalog);const p=ui.editing;
    for(const [lang,key,name] of [['fa','n','fan'],['fa','s','fas'],['fa','d','fad'],['fa','g','fag'],['en','n','enn'],['en','s','ens'],['en','d','end'],['en','g','eng']]){p.i[lang][key]=form.elements[name].value.trim()}
    p.categoryId=form.elements.category.value;p.status=form.elements.status.value;p.price=parseNum(form.elements.price.value);p.sortOrder=parseNum(form.elements.sortOrder.value)||nextSortOrder();
    p.tasteTags=[...form.querySelectorAll('input[name="taste"]:checked')].map(input=>input.value);p.palateTags=[];
    p.allergens=[...form.querySelectorAll('input[name="allergen"]:checked')].map(i=>i.value).concat((p.allergens||[]).filter(x=>!ALLERGEN_OPTIONS.some(o=>o[0]===x)));
    p.dietary=[...form.querySelectorAll('input[name="dietary"]:checked')].map(i=>i.value).concat((p.dietary||[]).filter(x=>!DIETARY_OPTIONS.some(o=>o[0]===x)));
    if(p.status!=='hidden'&&(p.tasteTags.length<1||p.tasteTags.length>MAX_TASTES)){showFormMsg(dialog,'برای محصول فعال، ۱ تا ۴ مزه انتخاب کن.');form.querySelector('input[name="taste"]')?.focus();return}
    p.aliases=[...new Set([...(p.aliases||[]),p.i.fa.n,p.i.en.n].filter(Boolean))];
    const index=catalog.products.findIndex(item=>item.id===p.id);if(index>=0)catalog.products[index]=p;else catalog.products.push(p);
    if(await saveCatalog('محصول ذخیره شد.')){dialog.close();render()}else catalog=previous
  })
  /* ---- list search & filters (view only; never writes) ---- */
  const STATUS_FILTERS=[['all','همه'],['available','موجود'],['sold_out','ناموجود'],['hidden','پنهان']];
  const STORY_PLACEHOLDERS={fa:'اطلاعات تکمیلی این محصول به\u200cزودی اضافه می\u200cشود.',en:'More product details will be added soon.'};
  const FOLD_DIGITS={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9','٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9'};
  function fold(v){return String(v==null?'':v).normalize('NFKC').toLowerCase().replace(/[\u200c\u200b]/g,' ').replace(/[\u200d\u200e\u200f\u061c]/g,'').replace(/[\u064b-\u065f\u0670\u0640]/g,'').replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[۰-۹٠-٩]/g,d=>FOLD_DIGITS[d]).replace(/\s+/g,' ').trim()}
  function productHaystack(p){const c=cat(p.categoryId);return fold([p.i?.fa?.n,p.i?.en?.n,p.slug,p.id,...(Array.isArray(p.aliases)?p.aliases:[]),c?.fa,c?.en].filter(Boolean).join(' '))}
  function nameMissing(lang,p){return !String(p.i?.[lang]?.n||'').trim()}
  function storyIncomplete(lang,text){const t=String(text||'').trim();return !t||fold(t)===fold(STORY_PLACEHOLDERS[lang])}
  function isIncomplete(p){return ['fa','en'].some(l=>nameMissing(l,p)||storyIncomplete(l,p.i?.[l]?.s))}
  function availableNameProblem(p){const miss=['fa','en'].filter(l=>nameMissing(l,p)).map(l=>l==='fa'?'نام فارسی':'نام English');return miss.length?`برای «موجود» شدن، ${miss.join(' و ')} لازم است. اول در ویرایش کامل کن یا وضعیت را «پنهان» نگه دار.`:''}
  function filterTokens(){const q=fold(ui.q);return q?q.split(' '):[]}
  function filtersActive(){return ui.adminCategory!=='all'||ui.status!=='all'||ui.incomplete||filterTokens().length>0}
  function productMatches(p,f,hay){
    if(f.category!=='all'&&p.categoryId!==f.category)return false;
    if(f.status!=='all'&&p.status!==f.status)return false;
    if(f.incomplete&&!isIncomplete(p))return false;
    return f.tokens.every(t=>hay.includes(t))
  }
  function applyFilters(){
    const base={category:ui.adminCategory,status:ui.status,incomplete:ui.incomplete,tokens:filterTokens()};
    const hay=new Map(catalog.products.map(p=>[p,productHaystack(p)]));
    const count=over=>catalog.products.filter(p=>productMatches(p,{...base,...over},hay.get(p))).length;
    const shown=new Set(catalog.products.filter(p=>productMatches(p,base,hay.get(p))).map(p=>p.id));
    document.querySelectorAll('#adminList [data-pid]').forEach(row=>{row.hidden=!shown.has(row.dataset.pid)});
    document.querySelectorAll('#adminList [data-section]').forEach(sec=>{
      const rows=[...sec.querySelectorAll('[data-pid]')];const n=rows.filter(r=>!r.hidden).length;sec.hidden=n===0;
      const c=sec.querySelector('[data-sec-count]');if(c)c.textContent=n===rows.length?`${digits(rows.length)} محصول`:`${digits(n)} از ${digits(rows.length)} محصول`});
    document.querySelectorAll('[data-admin-status]').forEach(b=>{const on=b.dataset.adminStatus===ui.status;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on);b.querySelector('[data-n]').textContent=digits(count({status:b.dataset.adminStatus}))});
    document.querySelectorAll('[data-admin-incomplete]').forEach(b=>{b.classList.toggle('active',ui.incomplete);b.setAttribute('aria-pressed',ui.incomplete);b.querySelector('[data-n]').textContent=digits(count({incomplete:true}))});
    document.querySelectorAll('[data-admin-cat]').forEach(b=>{const on=b.dataset.adminCat===ui.adminCategory;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});
    const total=catalog.products.length;
    const empty=document.getElementById('adminEmpty');if(empty)empty.hidden=shown.size>0||total===0;
    const rc=document.getElementById('resultCount');if(rc)rc.textContent=!total?'':shown.size===0?'نتیجه‌ای پیدا نشد':shown.size===total?`${digits(total)} محصول`:`نمایش ${digits(shown.size)} از ${digits(total)} محصول`;
    const cf=document.getElementById('clearFilters');if(cf)cf.hidden=!filtersActive()
  }
  function clearFilters(focusSearch){ui.q='';ui.status='all';ui.incomplete=false;ui.adminCategory='all';const input=document.getElementById('adminSearch');if(input)input.value='';applyFilters();if(focusSearch&&input)input.focus({preventScroll:true})}
  /* ---- language tabs & completeness hints in the product form ---- */
  function setEditorLang(root,lang,focus){
    root.querySelectorAll('[data-lang-tab]').forEach(b=>{const on=b.dataset.langTab===lang;b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1;b.classList.toggle('active',on);if(on&&focus)b.focus()});
    root.querySelectorAll('[data-lang-panel]').forEach(panel=>{panel.hidden=panel.dataset.langPanel!==lang})
  }
  function refreshLangWarnings(form){
    if(!form)return;
    ['fa','en'].forEach(lang=>{
      const name=form.elements[`${lang}n`].value.trim();const story=form.elements[`${lang}s`].value;const weak=storyIncomplete(lang,story);
      const hint=form.querySelector(`[data-story-hint="${lang}"]`);
      if(hint){hint.hidden=!weak;hint.textContent=weak?(story.trim()?'این هنوز متن موقت است؛ ذخیره می‌شود، ولی بهتر است روایت اصلی را بنویسی.':'روایت کوتاه خالی است؛ ذخیره می‌شود، ولی بهتر است بعداً کامل شود.'):''}
      const flag=form.querySelector(`[data-tab-flag="${lang}"]`);if(flag)flag.textContent=!name?'نام خالی':weak?'روایت ناقص':''
    })
  }
  function showFormMsg(root,msg){const box=root?.querySelector('.form-msg');if(!box)return;box.textContent=msg;box.hidden=false}
  function hideFormMsg(root){const box=root?.querySelector('.form-msg');if(box&&!box.hidden){box.hidden=true;box.textContent=''}}
  /* ---- undo for quick changes (one active undo; guarded by the server revision lock) ---- */
  const undoBox=document.getElementById('undoBox');
  let undoState=null;
  function clearUndo(){if(undoState)clearTimeout(undoState.timer);undoState=null;undoBox.innerHTML=''}
  function armUndo(ms){if(!undoState||undoState.busy)return;clearTimeout(undoState.timer);undoState.timer=setTimeout(clearUndo,ms)}
  function showUndo(message,before,focusSel){clearUndo();undoState={before,focusSel,timer:0,busy:false};undoBox.innerHTML=`<div class="toast undo"><span>${esc(message)}</span><button type="button" class="undo-btn" data-undo aria-keyshortcuts="Alt+Z" title="Alt+Z">برگردان</button></div>`;armUndo(10000)}
  function showUndoConflict(){clearUndo();undoBox.innerHTML='<div class="toast undo"><span>در همین فاصله نشست دیگری منو را تغییر داده است. برای اینکه کار او بازنویسی نشود، چیزی برگردانده نشد.</span><button type="button" class="undo-btn" data-reload>بارگذاری دوباره</button></div>'}
  async function undoLast(fromKeyboard){
    const u=undoState;if(!u||u.busy)return;
    u.busy=true;clearTimeout(u.timer);
    const btn=undoBox.querySelector('[data-undo]');if(btn){btn.disabled=true;btn.textContent='در حال برگرداندن…'}
    const current=catalog;catalog=clone(u.before);
    const ok=await saveCatalog('',{noReload:true,keepUndo:true,quiet:true});
    if(ok){clearUndo();render();toast('برگردانده شد.');if(u.focusSel&&document.querySelector(u.focusSel))focusAfter(u.focusSel);else if(fromKeyboard)document.getElementById('adminSearch')?.focus({preventScroll:true});return}
    catalog=current;
    if(lastSaveConflict){showUndoConflict();return}
    u.busy=false;if(btn){btn.disabled=false;btn.textContent='برگردان'}armUndo(10000)
  }
  function focusAfter(selector){const el=document.querySelector(selector);if(el&&!el.closest('[hidden]'))el.focus({preventScroll:true});else document.querySelector('#undoBox [data-undo]')?.focus({preventScroll:true})}
  undoBox.addEventListener('mouseenter',()=>{if(undoState)clearTimeout(undoState.timer)});
  undoBox.addEventListener('mouseleave',()=>armUndo(4000));
  undoBox.addEventListener('focusin',()=>{if(undoState)clearTimeout(undoState.timer)});
  undoBox.addEventListener('focusout',()=>armUndo(4000));
  document.getElementById('categoryEditor').addEventListener('close',()=>{ui.catDraft=null});
  document.addEventListener('input',event=>{
    const t=event.target;
    if(t.id==='adminSearch'){ui.q=t.value;clearTimeout(applyFilters.t);applyFilters.t=setTimeout(applyFilters,120);return}
    const dlg=t.closest?.('dialog');if(!dlg)return;
    hideFormMsg(dlg);t.removeAttribute?.('aria-invalid');
    if(t.form&&t.form.id==='productForm')refreshLangWarnings(t.form)
  });
  document.addEventListener('keydown',event=>{if(event.altKey&&event.code==='KeyZ'&&undoState&&!undoState.busy){event.preventDefault();undoLast(false)}});
  document.addEventListener('keydown',event=>{
    const tab=event.target.closest?.('[data-lang-tab]');if(!tab)return;
    let lang=null;if(event.key==='ArrowLeft'||event.key==='ArrowRight')lang=tab.dataset.langTab==='fa'?'en':'fa';else if(event.key==='Home')lang='fa';else if(event.key==='End')lang='en';
    if(lang){event.preventDefault();setEditorLang(tab.closest('dialog'),lang,true)}
  });
  loadCatalog().then(render)
  </script>
</body>
