async function loadCatalog() {

    try {

      catalog = clone(SEED);
    }

      headers: { accept: "application/json" },
      cache: "no-store",

    if (!response.ok || !data?.ok || !data.catalog)
      throw new Error(
        data?.error?.message || `Catalog HTTP ${response.status}`,

    catalog = data.catalog;
    catalogRevision = Number(data.revision) || 1;
    catalogUpdatedAt = data.updatedAt || null;
    catalogSource = "api";
    writeCatalogCache();
  } catch (error) {
    console.error("catalog_load_failed", error);
    const cached = readCatalogCache();
    if (cached) {
      catalog = cached.catalog;
      catalogRevision = Number(cached.revision) || 1;
      catalogUpdatedAt = cached.updatedAt || null;
      catalogSource = "cache";

async function save(msg) {

    localStorage.setItem("zaal-catalog", JSON.stringify(catalog));
    if (msg) toast(msg);
    return true;
  }
  try {
    const response = await fetch("/admin/api/catalog", {
      method: "PUT",
      credentials: "same-origin",
      headers: {
        accept: "application/json",
        "content-type": "application/json",
      },
      body: JSON.stringify({ catalog, revision: catalogRevision }),
    });
    const data = await response.json().catch(() => null);
    if (response.status === 401) {
      toast("نشست مدیریت منقضی شده؛ صفحه دوباره باز می‌شود.");
      setTimeout(() => location.reload(), 700);
      return false;
    }
    if (response.status === 409) {
      toast(
        "داده‌ها در نشست دیگری تغییر کرده‌اند؛ صفحه دوباره بارگذاری می‌شود.",
      );
      setTimeout(() => location.reload(), 900);
      return false;
    }
    if (!response.ok || !data?.ok)
      throw new Error(data?.error?.message || `Save HTTP ${response.status}`);

    catalogUpdatedAt = data.updatedAt || null;

function filters(q) {
  return {
    q: q.get("q") || "",
    cat: q.get("category") || "all",
    taste: (q.get("taste") || "").split(",").filter(Boolean),
    palate: (q.get("palate") || "").split(",").filter(Boolean),
    available: q.get("available") === "1",
  };
}
function filterQuery(f) {
  const q = new URLSearchParams();
  if (f.q) q.set("q", f.q);
  if (f.cat !== "all") q.set("category", f.cat);
  if (f.taste.length) q.set("taste", f.taste);
  if (f.palate.length) q.set("palate", f.palate);
  if (f.available) q.set("available", "1");
  return q;
}
function filtered(f, l) {
  const q = norm(f.q);
  return catalog.products
    .filter((p) => p.status !== "hidden")
    .filter((p) => !f.available || p.status === "available")
    .filter((p) => f.cat === "all" || p.categoryId === f.cat)
    .filter(
      (p) => !f.taste.length || f.taste.every((x) => p.tasteTags.includes(x)),
    )
    .filter(
      (p) =>
        !f.palate.length || f.palate.every((x) => p.palateTags.includes(x)),
    )
    .filter((p) => {
      const c = cat(p.categoryId),
        hay = [
          p.i.fa.n,
          p.i.en.n,
          p.i.fa.s,
          p.i.en.s,
          p.i.fa.d,
          p.i.en.d,
          ...p.aliases,
          ...p.tasteTags.map((x) => tx("taste", x, l)),
          ...p.palateTags.map((x) => tx("palate", x, l)),
          c.fa,
          c.en,
        ].join(" ");
      return !q || norm(hay).includes(q);
    })
    .sort(
      (a, b) =>
        (a.status === "sold_out") - (b.status === "sold_out") ||
        a.sortOrder - b.sortOrder,
    );
}

  app.innerHTML = `<div class="admin"><header class="admin-head"><div class="wrap"><b>زال / Zaal · <span>پنل زنده</span></b><div class="actions">${link("/fa/menu/", "پیش‌نمایش", "btn")}<button class="btn" data-action="reset-seed">بارگذاری منوی واقعی</button></div></div></header><main class="wrap admin-main"><div class="admin-title"><div><div class="eyebrow">Cloudflare D1 CMS</div><h1>مدیریت منو</h1><p class="muted">متصل به پایگاه داده؛ تغییرات ذخیره‌شده برای همهٔ بازدیدکنندگان اعمال می‌شوند.</p></div><div class="actions"><button class="btn" data-action="categories">دسته‌ها</button><button class="btn orange" data-action="add">+ محصول</button></div></div><div class="stats"><div class="stat"><b>${digits(catalog.products.length, "fa")}</b><span>همه</span></div><div class="stat"><b>${digits(a, "fa")}</b><span>موجود</span></div><div class="stat"><b>${digits(s, "fa")}</b><span>ناموجود</span></div><div class="stat"><b>${digits(h, "fa")}</b><span>پنهان</span></div></div><div class="notice">${catalogSource === "api" ? `متصل به پایگاه داده D1 · نسخهٔ ${digits(catalogRevision, "fa")} · آخرین ذخیره برای همه قابل مشاهده است.` : "هشدار: داده‌ها از نسخهٔ پشتیبان نمایش داده می‌شوند؛ اتصال API را بررسی کنید."}</div><div class="notice">سیاست Reset خودکار Sold out هنوز تعیین نشده؛ تغییر وضعیت فعلاً فقط دستی است.</div><h2>محصولات</h2><div id="admin-list">${adminRows()}</div></main></div><dialog class="editor" id="editor"></dialog><dialog class="editor" id="category-editor"></dialog><dialog class="editor" id="confirm"></dialog>`;
}
function blank() {
  return {
    id: `new-${Date.now()}`,
    slug: `new-${Date.now()}`,
    categoryId: catalog.categories[0].id,
    sortOrder: Date.now(),
    status: "hidden",
    price: 200000,
    priceVariants: [],
    currency: "TOMAN",
    i: {
      fa: { n: "", s: "", d: "", g: "" },
      en: { n: "", s: "", d: "", g: "" },
    },
    aliases: [],
    tasteTags: [],
    palateTags: [],
    profile: [2, 2, 2, 2],
    temperature: "hot",
    caffeine: "medium",
    allergens: [],
    dietary: [],
    art: ["#5E716B", "#FFFFFF", "#E35335"],
    kind: "cup",
    featured: false,
  };
}
function editor(id) {
  ui.editing = clone(id ? catalog.products.find((x) => x.id === id) : blank());
  const p = ui.editing,
    d = document.getElementById("editor");
  d.innerHTML = `<div class="sheet-head"><h2>${id ? `ویرایش ${esc(p.i.fa.n)}` : "محصول جدید"}</h2><button class="close" data-close="editor">×</button></div><form class="editor-body" id="product-form"><div class="tabs"><button class="on" type="button" data-tab="fa">FA · فارسی</button><button type="button" data-tab="en">EN · English</button></div>${["fa", "en"].map((l, i) => `<div class="fields" data-panel="${l}" ${i ? "hidden" : ""}><div class="field"><label>نام</label><input name="${l}n" value="${esc(p.i[l].n)}" required></div><div class="field"><label>روایت یک‌خطی</label><input name="${l}s" value="${esc(p.i[l].s)}"></div><div class="field full"><label>شرح</label><textarea name="${l}d">${esc(p.i[l].d)}</textarea></div><div class="field full"><label>محتویات</label><textarea name="${l}g">${esc(p.i[l].g)}</textarea></div></div>`).join("")}<div class="fields"><div class="field"><label>دسته</label><select name="category">${catalog.categories.map((x) => `<option value="${x.id}" ${p.categoryId === x.id ? "selected" : ""}>${esc(x.fa)}</option>`).join("")}</select></div><div class="field"><label>وضعیت</label><select name="status"><option value="available" ${p.status === "available" ? "selected" : ""}>موجود</option><option value="sold_out" ${p.status === "sold_out" ? "selected" : ""}>ناموجود</option><option value="hidden" ${p.status === "hidden" ? "selected" : ""}>پنهان</option></select></div><div class="field"><label>قیمت تومان</label><input name="price" value="${p.price}" dir="ltr"></div></div><div class="group"><h3>مزه‌ها</h3><div class="checks">${catalog.taste.map((x) => `<label><input name="taste" type="checkbox" value="${x[0]}" ${p.tasteTags.includes(x[0]) ? "checked" : ""}> ${x[1]}</label>`).join("")}</div></div><div class="group"><h3>ذائقه‌ها</h3><div class="checks">${catalog.palate.map((x) => `<label><input name="palate" type="checkbox" value="${x[0]}" ${p.palateTags.includes(x[0]) ? "checked" : ""}> ${x[1]}</label>`).join("")}</div></div></form><div class="sheet-foot"><button class="btn" data-close="editor">انصراف</button><button class="btn orange" type="submit" form="product-form">ذخیره محصول</button></div>`;
  d.showModal();
}
function categoryEditor() {
  const d = document.getElementById("category-editor");
  d.innerHTML = `<div class="sheet-head"><h2>دسته‌بندی‌ها</h2><button class="close" data-close="category-editor">×</button></div><div class="editor-body">${catalog.categories
    .sort((a, b) => a.order - b.order)
    .map(
      (x) =>
        `<div class="fields"><div class="field"><label>فارسی</label><input data-cat-fa="${x.id}" value="${esc(x.fa)}"></div><div class="field"><label>English</label><input data-cat-en="${x.id}" value="${esc(x.en)}" dir="ltr"></div></div>`,
    )
    .join(
      "",
    )}</div><div class="sheet-foot"><button class="btn" data-action="add-category">+ دسته</button><button class="btn orange" data-action="save-categories">ذخیره دسته‌ه��</button></div>`;
  d.showModal();
}
document.addEventListener("click", async (e) => {
  const r = e.target.closest("[data-route]");
  if (r) {
    e.preventDefault();
    go(r.dataset.route);
    return;
  }
  const cl = e.target.closest("[data-close]");
  if (cl) {
    document.getElementById(cl.dataset.close)?.close();
    return;
  }
  const p = e.target.closest("[data-product]");
  if (p) {
    detail(p.dataset.product);
    return;
  }
  const tg = e.target.closest("[data-go-taste]");
  if (tg) {
    go(`/${ui.l}/menu/?taste=${tg.dataset.goTaste}`);
    return;
  }
  const q = e.target.closest("[data-quick]");
  if (q) {
    const id = q.dataset.quick;
    ui.filters.taste = ui.filters.taste.includes(id)
      ? ui.filters.taste.filter((x) => x !== id)
      : [...ui.filters.taste, id];
    refreshMenu();
    return;
  }
  const ct = e.target.closest("[data-cat]");
  if (ct) {
    ui.filters.cat = ct.dataset.cat;
    refreshMenu();
    return;
  }
  const df = e.target.closest("[data-draft]");
  if (df) {
    const k = df.dataset.draft,
      id = df.dataset.value;
    ui.draft[k] = ui.draft[k].includes(id)
      ? ui.draft[k].filter((x) => x !== id)
      : [...ui.draft[k], id];
    document.getElementById("filter").innerHTML = sheet();
    return;
  }
  const a = e.target.closest("[data-action]")?.dataset.action;
  if (a === "filters") {
    openFilters();
    return;
  }
  if (a === "clear") {
    ui.filters = { q: "", cat: "all", taste: [], palate: [], available: false };
    const x = document.getElementById("menu-search");
    if (x) x.value = "";
    refreshMenu();
    return;
  }
  if (a === "reset-filters") {
    ui.draft = { ...ui.draft, taste: [], palate: [], available: false };
    document.getElementById("filter").innerHTML = sheet();
    return;
  }
  if (a === "apply-filters") {
    ui.draft.available =
      document.getElementById("available-only")?.checked || false;
    ui.filters = clone(ui.draft);
    document.getElementById("filter").close();
    refreshMenu();
    return;
  }
  if (a === "add") {
    editor();
    return;
  }
  if (a === "categories") {
    categoryEditor();
    return;
  }
  if (a === "reset-seed") {
    const d = document.getElementById("confirm");
    d.innerHTML =
      '<div class="sheet-head"><h2>بارگذاری منوی واقعی؟</h2><button class="close" data-close="confirm">×</button></div><div class="editor-body"><p>کاتالوگ فعلی با منوی واقعی ۵۹ محصولی جایگزین می‌شود. نسخهٔ قبلی در تاریخچهٔ D1 می‌ماند.</p></div><div class="sheet-foot"><button class="btn" data-close="confirm">انصراف</button><button class="btn orange" data-action="confirm-reset">بارگذاری و ذخیره</button></div>';
    d.showModal();
    return;
  }
  if (a === "confirm-reset") {
    const previous = clone(catalog);
    catalog = clone(SEED);
    if (await save("منوی واقعی در پایگاه داده ذخیره شد")) {
      document.getElementById("confirm").close();
      admin();
    } else catalog = previous;
    return;
  }
  if (a === "add-category") {
    catalog.categories.push({
      id: `cat-${Date.now()}`,
      order: catalog.categories.length + 1,
      fa: "دسته جدید",
      en: "New category",
      faDesc: "",
      enDesc: "",
    });
    document.getElementById("category-editor").close();
    categoryEditor();
    return;
  }
  if (a === "save-categories") {
    const previous = clone(catalog);
    document
      .querySelectorAll("[data-cat-fa]")
      .forEach(
        (i) =>
          (cat(i.dataset.catFa).fa = i.value.trim() || cat(i.dataset.catFa).fa),
      );
    document
      .querySelectorAll("[data-cat-en]")
      .forEach(
        (i) =>
          (cat(i.dataset.catEn).en = i.value.trim() || cat(i.dataset.catEn).en),
      );
    if (await save("دسته‌بندی‌ها در پایگاه داده ذخیره شدند")) {
      document.getElementById("category-editor").close();
      admin();
    } else catalog = previous;
    return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed) {
    editor(ed.dataset.edit);
    return;
  }
  const du = e.target.closest("[data-duplicate]");
  if (du) {
    const previous = clone(catalog),
      src = catalog.products.find((x) => x.id === du.dataset.duplicate),
      copy = clone(src);
    copy.id = `${src.id}-copy-${Date.now()}`;
    copy.slug = copy.id;
    copy.i.fa.n += " — کپی";
    copy.i.en.n += " — Copy";
    copy.status = "hidden";
    copy.sortOrder += 0.1;
    catalog.products.push(copy);
    if (await save("نسخهٔ مشابه ساخته و در پایگاه داده پنهان شد")) admin();
    else catalog = previous;
    return;
  }
  const sp = e.target.closest("[data-save-price]");
  if (sp) {
    const p = catalog.products.find((x) => x.id === sp.dataset.savePrice),
      v = parseNum(document.getElementById(`price-${p.id}`).value),
      previous = p.price;
    if (v <= 0) {
      toast("قیمت معتبر وارد کنید");
      return;
    }
    p.price = v;
    if (await save(`قیمت «${p.i.fa.n}» در پایگاه داده ذخیره شد`))
      document.getElementById(`price-${p.id}`).value = digits(v, "fa");
    else p.price = previous;
    return;
  }
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    document
      .querySelectorAll("[data-panel]")
      .forEach((x) => (x.hidden = x.dataset.panel !== tab.dataset.tab));
    document
      .querySelectorAll("[data-tab]")
      .forEach((x) =>
        x.classList.toggle("on", x.dataset.tab === tab.dataset.tab),
      );
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "menu-search") {
    ui.filters.q = e.target.value;
    refreshMenu();
  }
});
document.addEventListener("change", async (e) => {
  if (e.target.matches("[data-status]")) {
    const p = catalog.products.find((x) => x.id === e.target.dataset.status),
      previous = p.status;
    p.status = e.target.value;
    if (!(await save(`وضعیت «${p.i.fa.n}» در پایگاه داده تغییر کرد`))) {
      p.status = previous;
      e.target.value = previous;
    }
  }
});
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "product-form") return;
  e.preventDefault();
  const previous = clone(catalog),
    f = e.target,
    p = ui.editing;
  for (const l of ["fa", "en"])
    for (const k of ["n", "s", "d", "g"])
      p.i[l][k] = f.elements[l + k].value.trim();
  p.categoryId = f.elements.category.value;
  p.status = f.elements.status.value;
  p.price = parseNum(f.elements.price.value);
  p.tasteTags = [...f.querySelectorAll('input[name="taste"]:checked')].map(
    (x) => x.value,
  );
  p.palateTags = [...f.querySelectorAll('input[name="palate"]:checked')].map(
    (x) => x.value,
  );
  p.aliases = [
    ...new Set([...(p.aliases || []), p.i.fa.n, p.i.en.n].filter(Boolean)),
  ];
  const i = catalog.products.findIndex((x) => x.id === p.id);
  if (i >= 0) catalog.products[i] = p;
  else catalog.products.push(p);
  if (await save("محصول در پایگاه داده ذخیره شد")) {
    document.getElementById("editor").close();
    admin();
  } else catalog = previous;
});
function render() {
  const r = route();
  if (r.p === "/") {
    go(`/${localStorage.getItem("zaal-lang") || "fa"}/`);
    return;
  }
  if (r.p === "/admin/") {
    admin();
    return;
  }
  const l = lang(r.p);
  if (r.p === `/${l}/menu/`) menu(l, r.p, r.q);
  else landing(l, `/${l}/`, r.q);
}
window.addEventListener("popstate", render);
window.addEventListener("hashchange", render);
if ("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("/sw.js").catch(() => {});
loadCatalog().finally(() => render());

</script></body></html>
