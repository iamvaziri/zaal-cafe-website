:root{--ink:#000;--muted:#666;--sage-deep:var(--g);--line:var(--ln)}

.site-header{display:grid;grid-template-columns:minmax(76px,1fr) auto minmax(76px,1fr);gap:10px;height:100%;align-items:center}
.site-header .brand{justify-self:start;width:44px;height:44px;padding:2px;overflow:hidden;display:block}

.header-title{justify-self:center;text-align:center;font-size:1.05rem;line-height:1;letter-spacing:.16em;color:var(--ink)}
.header-actions{justify-self:end;display:flex;align-items:center;gap:.4rem}

async function loadCatalog() {
  if (location.protocol === "file:") {
    try {
      catalog = JSON.parse(localStorage.getItem("zaal-catalog")) || clone(SEED);
    } catch {
      catalog = clone(SEED);
    }
    catalogRevision = 1;
    catalogSource = "file";
    return;
  }
  try {
    const response = await fetch("/api/catalog", {
      headers: { accept: "application/json" },
      cache: "no-store",
    });
    const data = await response.json().catch(() => null);
    if (!response.ok || !data?.ok || !data.catalog)
      throw new Error(
        data?.error?.message || `Catalog HTTP ${response.status}`,
      );
    catalog = data.catalog;
    catalogRevision = Number(data.revision) || 1;
    catalogUpdatedAt = data.updatedAt || null;
    catalogSource = "api";
    writeCatalogCache();
  } catch (error) {
    console.error("catalog_load_failed", error);
    const cached = readCatalogCache();
    if (cached) {
      catalog = cached.catalog;
      catalogRevision = Number(cached.revision) || 1;
      catalogUpdatedAt = cached.updatedAt || null;
      catalogSource = "cache";

async function save(msg) {

    localStorage.setItem("zaal-catalog", JSON.stringify(catalog));
    if (msg) toast(msg);
    return true;
  }
  try {
    const response = await fetch("/admin/api/catalog", {
      method: "PUT",
      credentials: "same-origin",
      headers: {
        accept: "application/json",
        "content-type": "application/json",
      },
      body: JSON.stringify({ catalog, revision: catalogRevision }),
    });
    const data = await response.json().catch(() => null);
    if (response.status === 401) {
      toast("نشست مدیریت منقضی شده؛ صفحه دوباره باز می‌شود.");
      setTimeout(() => location.reload(), 700);
      return false;
    }
    if (response.status === 409) {
      toast(
        "داده‌ها در نشست دیگری تغییر کرده‌اند؛ صفحه دوباره بارگذاری می‌شود.",
      );
      setTimeout(() => location.reload(), 900);
      return false;
    }
    if (!response.ok || !data?.ok)
      throw new Error(data?.error?.message || `Save HTTP ${response.status}`);
    catalogRevision = Number(data.revision) || catalogRevision + 1;
    catalogUpdatedAt = data.updatedAt || null;
    catalogSource = "api";
    writeCatalogCache();
    if (msg) toast(msg);
    return true;
  } catch (error) {
    console.error("catalog_save_failed", error);
